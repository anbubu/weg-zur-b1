<style>
/* Layout: Brilliant-calm white screens with Drops-colour tiles. A sidebar and an open canvas on desktop; on phones one scrolling column above a floating tab bar. Dark mode is Drops' deep purple. */
:root{
  --g1:#F6F6F9; --g2:#F6F6F9; --g3:#F6F6F9; --frame:transparent;
  --panel:#FFFFFF; --panel2:#F2F2F6; --line:#E4E4EB; --ink:#17171F; --muted:#636373; --faint:#9C9CAB;
  --accent:#7B5CFA; --accent-fill:#6A45F2; --accent-ink:#5A36E0; --accent-soft:#EFEBFF; --on-accent:#FFFFFF;
  --cta:#1D1D27; --cta-edge:#000000; --on-cta:#FFFFFF;
  --go:#21B95A; --go-edge:#16904A; --on-go:#FFFFFF; --lime:#E2EA6A; --lime-edge:#B5BD3B; --on-lime:#2A1150;
  --sun:#F9CF46; --sun-soft:#FFF6D6; --ring3:#188A7E; --glow:#EAF8DF;
  --t1:#157A70; --t2:#BC2A6E; --t3:#2C7D33; --t4:#7B3FE4; --t5:#A9570C; --t6:#2B67D1;
  --p-rose:#FDE7F1; --p-butter:#FFF3D6; --p-mint:#DDF6EF; --p-lilac:#EFEBFF; --p-sky:#E3EEFE;
  --der:#2563EB; --die:#C2185B; --das:#15803D;
  --ok:#15803D; --okbg:#DCFCE7; --bad:#DC2626; --badbg:#FEE2E2;
  --shadow:none;
  --f:"Plus Jakarta Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif; --fm:var(--f);
  --r-panel:24px; --r-card:18px; --r-field:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-mode="light"]){
  --g1:#371565; --g2:#371565; --g3:#371565; --frame:transparent;
  --panel:#45207A; --panel2:#522C8A; --line:#613B99; --ink:#FFFFFF; --muted:#D6C8EE; --faint:#A897C9;
  --accent:#E2EA6A; --accent-fill:#E2EA6A; --accent-ink:#E9EF8C; --accent-soft:#5C3696; --on-accent:#2A1150;
  --cta:#E2EA6A; --cta-edge:#B4BB3A; --on-cta:#2A1150;
  --go:#34D399; --go-edge:#109C74; --on-go:#0B2A1E; --lime:#E2EA6A; --lime-edge:#B4BB3A; --on-lime:#2A1150;
  --sun:#F9CF46; --sun-soft:#5A3A84; --ring3:#5FD3C6; --glow:#5A3A8A;
  --t1:#157A70; --t2:#CC3379; --t3:#2C7D33; --t4:#8E52F0; --t5:#A9570C; --t6:#2B67D1;
  --p-rose:#5E2F7C; --p-butter:#5E3F76; --p-mint:#2E4F7A; --p-lilac:#55348C; --p-sky:#3A3F8C;
  --der:#9DC3FF; --die:#FF8FC4; --das:#7FE3AE;
  --ok:#6EE7A8; --okbg:#1F5240; --bad:#FF9B9B; --badbg:#6A2350;
  --shadow:none;
  color-scheme:dark;
}}
:root[data-theme="dark"]:not([data-mode="light"]),:root[data-mode="dark"]{
  --g1:#371565; --g2:#371565; --g3:#371565; --frame:transparent;
  --panel:#45207A; --panel2:#522C8A; --line:#613B99; --ink:#FFFFFF; --muted:#D6C8EE; --faint:#A897C9;
  --accent:#E2EA6A; --accent-fill:#E2EA6A; --accent-ink:#E9EF8C; --accent-soft:#5C3696; --on-accent:#2A1150;
  --cta:#E2EA6A; --cta-edge:#B4BB3A; --on-cta:#2A1150;
  --go:#34D399; --go-edge:#109C74; --on-go:#0B2A1E; --lime:#E2EA6A; --lime-edge:#B4BB3A; --on-lime:#2A1150;
  --sun:#F9CF46; --sun-soft:#5A3A84; --ring3:#5FD3C6; --glow:#5A3A8A;
  --t1:#157A70; --t2:#CC3379; --t3:#2C7D33; --t4:#8E52F0; --t5:#A9570C; --t6:#2B67D1;
  --p-rose:#5E2F7C; --p-butter:#5E3F76; --p-mint:#2E4F7A; --p-lilac:#55348C; --p-sky:#3A3F8C;
  --der:#9DC3FF; --die:#FF8FC4; --das:#7FE3AE;
  --ok:#6EE7A8; --okbg:#1F5240; --bad:#FF9B9B; --badbg:#6A2350;
  --shadow:none;
  color-scheme:dark;
}
:root[data-mode="light"]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--g3) linear-gradient(180deg,var(--g1) 0,var(--g2) 32%,var(--g3) 72%) no-repeat;background-attachment:fixed;color:var(--ink);
  font:15px/1.55 var(--f);padding-inline:16px;padding-block:20px 28px;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent-fill);color:var(--on-accent)}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;letter-spacing:-.015em;font-weight:650}
h1{font-size:1.35rem} h2{font-size:1.45rem} h3{font-size:1.06rem}
h4{font-size:.78rem;font-weight:600;letter-spacing:.02em;color:var(--muted);margin:1.3em 0 .45em}
p{margin:.5em 0}
a{color:var(--accent-ink);text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
svg.i{width:18px;height:18px;flex:none;stroke-width:1.9}
.muted{color:var(--muted)}
.m{color:var(--der);font-weight:650} .f{color:var(--die);font-weight:650} .n{color:var(--das);font-weight:650} .pl{color:var(--muted);font-weight:650}
.hl{color:var(--accent-ink)}
.num-f{font-family:var(--fm);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- shell ---------- */
.shell{max-width:1420px;margin:0 auto;display:grid;grid-template-columns:232px minmax(0,1fr);gap:14px;padding:14px;background:var(--frame);border-radius:30px}
.side{background:var(--panel);border-radius:var(--r-panel);padding:18px 14px;position:sticky;top:calc(34px + env(safe-area-inset-top,0px));align-self:start;
  min-height:calc(100dvh - 96px);display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 16px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent-fill);color:var(--on-accent);font:700 .82rem var(--f);
  box-shadow:0 0 0 4px var(--accent-soft)}
.brand b{display:block;font-size:1rem;letter-spacing:-.02em} .brand small{color:var(--muted);font-size:.74rem}
.navlabel{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 10px 6px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup button{letter-spacing:.02em;display:flex;align-items:center;gap:11px;border:0;background:none;padding:10px 12px;border-radius:999px;font-size:.9rem;font-weight:500;color:var(--ink);text-align:left;transition:background .18s,color .18s}
.navgroup button:hover{background:var(--panel2)}
.navgroup button[aria-current="page"]{background:var(--accent-fill);color:var(--on-accent);font-weight:600}
.navgroup button .badge{margin-left:auto;font:600 .7rem var(--fm);background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:1px 7px}
.navgroup button[aria-current="page"] .badge{background:rgba(255,255,255,.25);color:inherit}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 4px}
.modes button{display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:8px 10px;font-size:.82rem;font-weight:500;background:var(--panel2);color:var(--ink)}
.modes button[aria-pressed="true"]{background:var(--cta);color:var(--on-cta)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.84rem;padding:0 8px}
.switch input{accent-color:var(--accent);width:18px;height:18px}
.sync{font:inherit;font-size:.74rem;color:var(--muted);padding:0 8px;display:flex;gap:6px;align-items:center;background:none;border:0;cursor:pointer;text-align:left}
.sync:hover{color:var(--ink)}
.sync svg.i{width:14px;height:14px}
.mainwrap{display:flex;flex-direction:column;gap:14px;min-width:0}
.topbar{background:var(--panel);border-radius:var(--r-panel);padding:14px 16px 14px 22px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.tb-title{flex:1;min-width:0}
.tb-title h1{letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title p{margin:2px 0 0;color:var(--muted);font-size:.84rem}
@media (max-width:480px){.nm{display:none}#chipXp{display:none}}
.chips{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:999px;background:var(--panel2);font:600 .84rem var(--fm);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip svg.i{width:16px;height:16px;color:var(--faint)}
.chip.lit svg.i{color:var(--accent)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--sun-soft);color:var(--ink);display:grid;place-items:center;font-weight:700;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--panel2);color:var(--ink);display:none;place-items:center}
.iconbtn.always{display:grid}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.field{display:flex;flex-direction:column;gap:6px;font-size:.84rem;color:var(--muted)}
.field input{font:inherit;font-size:.95rem;color:var(--ink)}
.write.code{min-height:110px;font:500 .74rem/1.45 var(--fm);word-break:break-all}
#main{display:flex;flex-direction:column;gap:14px;min-width:0}

@media (max-width:900px){
  /* App shell. The page itself never scrolls: only .mainwrap does, and the tab bar is a normal item at the bottom.
     Nothing is position:fixed against the window, so a phone browser's sliding address bar cannot move or hide the bar. */
  html,body{height:100%;overflow:hidden}
  @supports (height:100dvh){html{height:100dvh}}
  body{padding:0;background-attachment:scroll}
  .shell{height:100%;max-width:none;margin:0;display:flex;flex-direction:column;padding:0;gap:0;background:none}
  .mainwrap{order:1;flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 16px 16px}
  .topbar{position:sticky;top:8px;z-index:5;margin-top:12px}
  .side{order:2;align-self:stretch;position:static;flex:none;min-height:0;z-index:20;border-radius:20px 20px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));flex-direction:row;box-shadow:0 -10px 26px -16px rgba(120,40,20,.4)}
  .side .brand,.side .navlabel,.side .secondary,.side .side-foot{display:none}
  .navgroup.primary{flex-direction:row;justify-content:space-around;width:100%}
  .navgroup.primary button{flex-direction:column;gap:3px;font-size:.68rem;padding:7px 4px;border-radius:14px;min-width:58px;align-items:center}
  .navgroup.primary button .badge{display:none}
  .topbar{padding:10px 10px 10px 16px;border-radius:18px}
  .tb-title p{display:none} .tb-title h1{font-size:1.12rem}
  .iconbtn{display:grid} .avatar{display:none}
  .chips{gap:6px} .chip{padding:0 9px;font-size:.8rem}
  .chip{height:34px;padding:0 10px}
}

/* ---------- building blocks ---------- */
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border-radius:var(--r-panel);padding:20px;box-shadow:var(--shadow);min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.btn{letter-spacing:.02em;border:0;background:var(--cta);color:var(--on-cta);border-radius:999px;padding:11px 20px;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:8px;justify-content:center;
  transition:transform .12s,box-shadow .18s,background .18s;white-space:nowrap}
.btn:hover:not(:disabled){box-shadow:0 8px 20px -10px rgba(36,26,24,.5)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.ghost{background:var(--panel2);color:var(--ink)}
.btn.coral{background:var(--accent-fill);color:var(--on-accent)}
.btn.big{width:100%;padding:15px;font-size:1rem}
.btn:disabled{opacity:.45;cursor:default}
.btn svg.i{width:17px;height:17px}
.linkbtn{background:none;border:0;color:var(--muted);padding:6px 2px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.linkbtn:hover{color:var(--ink)}
.tag{font:600 .72rem var(--f);letter-spacing:.02em;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 .68rem var(--f);letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:4px 10px;background:var(--panel);color:var(--ink)}
.pill.done{background:var(--accent-fill);color:var(--on-accent)} .pill.next{background:var(--sun);color:#3A2600}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .5s cubic-bezier(.16,1,.3,1)}
.say{border:0;background:var(--accent-soft);color:var(--accent-ink);border-radius:50%;width:34px;height:34px;display:inline-grid;place-items:center;flex:none;transition:transform .12s}
.say:active{transform:scale(.94)}
.say svg.i{width:16px;height:16px}
.tile{text-align:left;border:0;border-radius:var(--r-panel);padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--panel);box-shadow:var(--shadow);transition:transform .18s cubic-bezier(.16,1,.3,1),box-shadow .18s}
.tile:hover:not(:disabled){transform:translateY(-2px)}
.tile:disabled{opacity:.55;cursor:default}
.tile b{font-size:1.08rem;letter-spacing:-.015em;font-weight:650}
.tile span{color:var(--muted);font-size:.88rem}
.tile .tag{color:var(--ink);opacity:.7}
.tile .ic{width:38px;height:38px;border-radius:50%;background:var(--panel);display:grid;place-items:center;margin-bottom:6px;box-shadow:0 0 0 1px rgba(0,0,0,.04)}
.tile.p-rose{background:var(--p-rose)} .tile.p-butter{background:var(--p-butter)} .tile.p-mint{background:var(--p-mint)} .tile.p-lilac{background:var(--p-lilac)} .tile.p-sky{background:var(--p-sky)}
.tile[class*="p-"] span{color:var(--ink);opacity:.72}
.hist{display:flex;flex-direction:column;font-size:.92rem}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.hist div:last-child{border-bottom:0}
.pass{color:var(--ok);font-weight:650} .fail{color:var(--bad);font-weight:650}
.streak-num{font:600 3rem/1 var(--fm);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.score{font:600 2.5rem/1 var(--fm);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--panel2);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Heute bento ---------- */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;
  grid-template-areas:"cont cont goal streak" "stats stats rings streak" "weak weak cal cal" "quick quick quick quick"}
.b-cont{grid-area:cont} .b-goal{grid-area:goal} .b-streak{grid-area:streak} .b-stats{grid-area:stats} .b-rings{grid-area:rings} .b-weak{grid-area:weak} .b-cal{grid-area:cal} .b-quick{grid-area:quick}
.bento > .card{display:flex;flex-direction:column}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.chead h3{font-size:1rem}
.cont h2{font-size:1.5rem;margin:4px 0 2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:.84rem;margin:6px 0 14px}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg.i{width:15px;height:15px;color:var(--accent)}
.progline{display:flex;justify-content:space-between;font-size:.84rem;color:var(--muted);margin-bottom:6px}
.progline b{color:var(--ink);font-family:var(--fm)}
.cta-row{margin-top:auto;padding-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.cta-row .btn.wide{flex:1;justify-content:space-between;padding-inline:22px}
.plan{margin:2px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.plan li{display:flex;gap:9px;align-items:center}
.plan li svg.i{width:16px;height:16px;color:var(--accent)}
.gauge{position:relative;display:grid;place-items:center;margin:auto 0}
.gauge svg{width:100%;max-width:300px;height:auto;overflow:visible}
.gauge .seg{fill:none;stroke:var(--panel2);stroke-width:14;stroke-linecap:butt}
.gauge .seg.on{stroke:var(--sun)} .gauge .seg.on.hot{stroke:var(--accent)}
.gauge .read{position:absolute;bottom:4px;text-align:center}
.gauge .read b{font:800 2.6rem/1 var(--fm);letter-spacing:-.04em;display:block}
.gauge .read small{color:var(--muted);font-size:.78rem}
.goalsel{display:flex;justify-content:center;margin-top:10px}
.goalsel select{font:500 .8rem var(--f);border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:999px;padding:5px 10px}
.bignum{font:600 3rem/1 var(--fm);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.bignum small{font:500 1rem var(--f);letter-spacing:0;color:var(--muted);margin-left:6px}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:16px 0 8px;max-width:300px}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--panel2)}
.dots i.on{background:var(--sun)} .dots i.today{box-shadow:0 0 0 2px var(--ink) inset} .dots i.on.today{box-shadow:0 0 0 2px var(--ink) inset;background:var(--accent)}
.dots i.frz{background:linear-gradient(90deg,var(--muted) 50%,var(--panel2) 50%)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chart{display:grid;grid-template-columns:auto 1fr;gap:10px;height:236px}
.yax{display:flex;flex-direction:column;justify-content:space-between;font:500 .72rem var(--fm);color:var(--muted);padding-bottom:26px;text-align:right}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;position:relative}
.bars .goal-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--faint);pointer-events:none}
.bcol{display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bcol .track{width:100%;max-width:44px;flex:1;border-radius:12px;background:var(--panel2);display:flex;align-items:flex-end;overflow:hidden;position:relative}
.bcol .fill{width:100%;border-radius:12px;background:repeating-linear-gradient(-45deg,var(--accent) 0 3px,transparent 3px 7px);box-shadow:inset 0 0 0 1.5px var(--accent);transform-origin:bottom;transition:transform .7s cubic-bezier(.16,1,.3,1)}
.bcol .fill.met{background:repeating-linear-gradient(-45deg,var(--sun) 0 3px,transparent 3px 7px);box-shadow:inset 0 0 0 1.5px var(--sun)}
.bcol .fill.today{background:var(--accent)}
.bcol .fill.today.met{background:var(--sun)}
.bcol small{font:500 .74rem var(--f);color:var(--muted)}
.bcol.is-today small{color:var(--ink);font-weight:650}
.bcol .tip-n{position:absolute;top:6px;left:0;right:0;text-align:center;font:600 .7rem var(--fm);color:var(--ink)}
.rings{display:grid;place-items:center;flex:1;margin:4px 0 12px}
.rings{position:relative}
.rings svg{width:100%;max-width:210px;height:auto}
.rings .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.rings .mid b{font:600 1.6rem/1 var(--fm);letter-spacing:-.04em;display:block}
.rings .mid small{font-size:.74rem;color:var(--muted)}
.rings circle{fill:none;stroke-width:11;stroke-linecap:round}
.rings .trk{stroke:var(--panel2)}
.wlist{display:flex;flex-direction:column}

// ---- helpers ----
const rnd = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
function mkOptions(answer, pool, n=4){
  const others = shuffle([...new Set(pool)].filter(x => x !== answer)).slice(0, n-1);
  const options = shuffle([answer, ...others]);
  return {options, answer: options.indexOf(answer)};
}
function enArt(art, n){ return art==='def' ? 'the' : art==='mein' ? 'my' : (/^[aeiou]/i.test(n) ? 'an' : 'a'); }
function fillEn(t, art, n){ const a = enArt(art, n); return t.replace('{A}', cap(a)).replace('{a}', a).replace('{n}', n); }
const gspan = (g, s) => `<span class="${g}">${s}</span>`;

// ---- question generators: each returns {lead, html, options, answer, explain, en?, say?, fill?, gopts?} ----
const GEN = {
  art(p){
    const tpls = TPL[p.group].filter(t => p.cases.includes(t.c) && t.arts.some(a => p.arts.includes(a)));
    const t = rnd(tpls), art = rnd(t.arts.filter(a => p.arts.includes(a))), [de,g,en] = rnd(t.nouns);
    const ans = ART[art][t.c][g], start = t.de.startsWith('___'), fx = s => start ? cap(s) : s;
    const pool = Object.values(ART[art]).flatMap(o => Object.values(o));
    const o = mkOptions(ans, pool);
    const sentence = t.de.replace('{N}', de);
    return {lead:'Fill in the gap', html: sentence, sub:`Noun: ${gspan(g, G[g]+' '+de)}`,
      options:o.options.map(fx), answer:o.answer, fill:fx(ans), say: sentence.replace('___', fx(ans)), en: fillEn(t.en, art, en),
      explain:`${t.why} Ask <b>${CASE_Q[t.c]}</b> → <b>${CASE_NAME[t.c]}</b>.<br>${gspan(g, G[g]+' '+de)} → <b>${ans} ${de}</b>`};
  },
  detect(p){
    const t = rnd(TPL.case.filter(x => p.cases.includes(x.c))), [de,g,en] = rnd(t.nouns);
    const art = t.arts.includes('def') ? 'def' : t.arts[0], a = ART[art][t.c][g];
    const phrase = (t.de.startsWith('___') ? cap(a) : a) + ' ' + de;
    const sentence = t.de.replace('___ {N}', phrase);
    const opts = ['nom','akk','dat'].filter(c => p.cases.includes(c));
    return {lead:'Which case is the highlighted part?', html: t.de.replace('___ {N}', `<mark>${phrase}</mark>`),
      options: opts.map(c => CASE_NAME[c]), answer: opts.indexOf(t.c), say: sentence, en: fillEn(t.en, art, en),
      explain:`${t.why} Ask <b>${CASE_Q[t.c]}</b> → <b>${CASE_NAME[t.c]}</b>.`};
  },
  pron(p){
    const t = rnd(TPL.case.filter(x => x.pron && p.cases.includes(x.c))), [de,g] = rnd(t.nouns);
    const start = t.de.startsWith('___'), fx = s => start ? cap(s) : s, a = ART.def[t.c][g];
    const original = t.de.replace('___', fx(a)).replace('{N}', de);
    const ans = PRON3[t.c][g], blank = t.de.replace(' {N}', '');
    const o = mkOptions(ans, ['er','sie','es','ihn','ihm','ihr']);
    const thing = THINGS.some(x => x[0] === de);
    return {lead:'Replace the noun with a pronoun', html: blank, sub:`${original}`,
      options:o.options.map(fx), answer:o.answer, fill:fx(ans), say: blank.replace('___', fx(ans)),
      explain:`${gspan(g, a+' '+de)} is ${g==='m'?'masculine':g==='f'?'feminine':'neuter'} + ${CASE_NAME[t.c]} → <b>${ans}</b>.${thing ? ' Things get er/sie/es too, by their gender.' : ''}`};
  },
  dialog(p){
    const d = rnd(DIALOG.filter(x => p.cases.includes(x[3])));
    const [q, a, ans, c, note] = d, start = a.startsWith('___'), fx = s => start ? cap(s) : s;
    const pool = [PARTNER[ans], ...shuffle(OBJ_PRON).slice(0, 5)].filter(x => x && x !== ans);
    const opts = shuffle([ans, ...[...new Set(pool)].slice(0, 3)]);
    return {lead:'Answer the question', html: a, sub:`– ${q}`, options:opts.map(fx), answer:opts.indexOf(ans), fill:fx(ans),
      say: q + ' ' + a.replace('___', fx(ans)), explain:`${note} (${CASE_NAME[c]})`};
  },
  ptable(p){
    const row = rnd(PRON), c = rnd(p.cases), ans = row[CI[c]];
    const pool = [row[0], row[1], row[2], ...PRON.map(r => r[CI[c]])];
    const o = mkOptions(ans, pool);
    return {lead:`Pronoun table · ${CASE_NAME[c]}`, html:`${row[0]} → ___`, sub:`“${row[0]}” (${row[3]}) in the ${CASE_NAME[c]}`,
      options:o.options, answer:o.answer, fill:ans, explain:`${row[0]} · ${row[1]} · ${row[2]} (Nom · Akk · Dat)`};
  },
  verb(p){
    const vn = rnd(p.verbs), v = VERBS[vn], s = rnd(SUBJ), ans = v.f[s[1]];
    const o = mkOptions(ans, v.f);
    const text = `${s[0]} ___ ${v.tail}`;
    return {lead:`Conjugate: ${vn}`, html:text, sub: s[2] ? `${s[0]} = ${s[2]}` : '', options:o.options, answer:o.answer, fill:ans,
      say:text.replace('___', ans), explain:`${s[0]} → <b>${ans}</b>. ${v.note}`};
  },
  gender(p){
    const v = rnd(VOCAB.filter(x => x.th === p.th && ['m','f','n'].includes(x.g)));
    const h = genderHint(v);
    return {lead:'der, die or das?', html:v.de, sub:v.en, gopts:true, options:['der','die','das'], answer:['m','f','n'].indexOf(v.g),
      say:G[v.g]+' '+v.de, explain:`${gspan(v.g, G[v.g]+' '+v.de)}${h ? ` · ${h.text}${h.exception ? ' <b>(this one is an exception!)</b>' : ''}` : ''}`};
  },
  meaning(p){
    const pool = VOCAB.filter(x => x.th === p.th), v = rnd(pool), art = v.g ? G[v.g]+' ' : '';
    if (Math.random() < .5){
      const o = mkOptions(v.en, pool.map(x => x.en));
      return {lead:'What does it mean?', html: v.g ? gspan(v.g, art)+v.de : v.de, options:o.options, answer:o.answer, say:art+v.de, explain:`${art}${v.de} = ${v.en}`};
    }
    const o = mkOptions(art+v.de, pool.map(x => (x.g ? G[x.g]+' ' : '')+x.de));
    return {lead:'How do you say it in German?', html: v.en, options:o.options, answer:o.answer, say:art+v.de, explain:`${v.en} = ${art}${v.de}`};
  },
  prepcase(p){
    const pr = rnd(PREPS.filter(x => p.kinds.includes(x[1])));
    const keys = p.kinds.includes('both') ? ['akk','dat','both'] : ['akk','dat'];
    const label = {akk:'Akkusativ', dat:'Dativ', both:'Both (Wo? / Wohin?)'};
    return {lead:'Which case comes after it?', html: pr[0], sub: pr[2], options: keys.map(k => label[k]), answer: keys.indexOf(pr[1]),
      explain: pr[1]==='both' ? `${pr[0]} is a two-way preposition: Wo? → Dativ, Wohin? → Akkusativ.` : `${pr[0]} always takes the ${label[pr[1]]}.`};
  },
};

function buildQuiz(drills){
  const out = [], seen = new Set();
  for (const [type, count, params] of drills){
    for (let i=0, tries=0; i<count && tries<count*12; tries++){
      const q = GEN[type](params), key = q.html + '|' + q.options[q.answer];
      q.kind = kindKey(type, params);
      if (seen.has(key)) continue;
      seen.add(key); out.push(q); i++;
    }
  }
  return out;
}

const LESSONS = [
  {id:'aussprache', primer:true, kind:'Aussprache', title:'Aussprache & Alphabet', sub:'How German sounds, letter by letter',
   intro:`<p>German is written almost exactly as it sounds. Learn the sounds below once, and you can read any German word aloud. Tap the examples to hear them.</p>
<h4>The alphabet</h4>
<p>The 26 letters you know, plus four extra: <b>ä ö ü</b> (umlauts) and <b>ß</b> (sharp s). The letter names: A (ah) · B (beh) · C (tseh) · D (deh) · E (eh) · F (eff) · G (geh) · H (hah) · I (ee) · J (yot) · K (kah) · L (ell) · M (emm) · N (enn) · O (oh) · P (peh) · Q (koo) · R (err) · S (ess) · T (teh) · U (oo) · V (fow) · W (veh) · X (iks) · Y (ypsilon) · Z (tset).</p>
<p class="tip">You will spell your name on the phone, at the Bürgeramt and at work. Practise yours: M-E-H-D-I = emm, eh, hah, deh, ee.</p>
<h4>Sounds that differ from English</h4>
<div class="tablewrap"><table class="ct"><tr><th>Letters</th><th>Sound</th><th>Example</th></tr>
<tr><td><b>ei</b></td><td>like “eye”</td><td>nein, Zeit, mein</td></tr>
<tr><td><b>ie</b></td><td>a long “ee”</td><td>Bier, wie, Liebe</td></tr>
<tr><td><b>eu, äu</b></td><td>like “oy” in boy</td><td>heute, Häuser</td></tr>
<tr><td><b>sch</b></td><td>“sh”</td><td>Schule, schön</td></tr>
<tr><td><b>sp-, st-</b> at the start</td><td>“shp”, “sht”</td><td>spielen, Stadt</td></tr>
<tr><td><b>ch</b></td><td>soft hiss after e, i (ich); rougher after a, o, u (Buch)</td><td>ich, nicht, Buch</td></tr>
<tr><td><b>z</b></td><td>“ts”</td><td>Zeit, zehn</td></tr>
<tr><td><b>v</b></td><td>usually “f”</td><td>Vater, vier</td></tr>
<tr><td><b>w</b></td><td>English “v”</td><td>Wasser, wir</td></tr>
<tr><td><b>s</b> before a vowel</td><td>“z”</td><td>Sonne, sehen</td></tr>
<tr><td><b>ß</b></td><td>a sharp “ss”</td><td>Straße, heißen</td></tr>
<tr><td><b>ü</b></td><td>say “ee” with round lips</td><td>über, müde</td></tr>
<tr><td><b>ö</b></td><td>say “ay” with round lips</td><td>schön, möchte</td></tr>
<tr><td><b>ä</b></td><td>like the “e” in bed</td><td>Mädchen, Käse</td></tr></table></div>
<h4>Three more rules</h4>
<p><b>Every noun starts with a capital letter:</b> der Tisch, die Arbeit, das Zimmer. <b>The stress is usually on the first syllable:</b> ARbeit, WOHnung. <b>A double consonant makes the vowel before it short:</b> kommen, Mitte, Kamm.</p>
<p class="tip">Don’t worry about a perfect accent. Listen, repeat out loud, and keep going. Everything else in this app builds on these sounds.</p>`,

  {id:'hallo', kind:'Wortschatz + Grammatik', title:'Hallo!', sub:'Greetings and sein (to be)', th:'hallo',
   intro:`<p>German has a polite and a casual “you”. Use <b>du</b> with friends, family, kids and classmates. Use <b>Sie</b> (always a capital S) with strangers, officials and your future Ausbildung boss, until they offer you <i>du</i>.</p>
<h4>sein · to be</h4>
<div class="tablewrap"><table class="ct"><tr><td>ich</td><td><b>bin</b></td><td>wir</td><td><b>sind</b></td></tr><tr><td>du</td><td><b>bist</b></td><td>ihr</td><td><b>seid</b></td></tr><tr><td>er / sie / es</td><td><b>ist</b></td><td>sie / Sie</td><td><b>sind</b></td></tr></table></div>
<p class="tip">Greetings follow the clock: <i>Guten Morgen</i> until about 11, <i>Guten Tag</i> during the day, <i>Guten Abend</i> from about 6 pm. <i>Hallo</i> works any time with people you know.</p>`,

<p class="tip"><b>sie</b> has three meanings, and the verb tells you which: <i>sie lernt</i> = she learns, <i>sie lernen</i> = they learn, <i>Sie lernen</i> = you (formal) learn.</p>

  {id:'genus', kind:'Grammatik + Wortschatz', title:'der, die, das', sub:'Every noun has a gender', th:'dinge',
   intro:`<p>Every German noun is masculine, feminine or neuter, and the article shows which. In this app they always have the same colors:</p>

<p>The gender often has nothing to do with meaning: <i>das Mädchen</i> (the girl) is neuter. So never learn a noun alone. Learn <i>der Tisch</i>, not just <i>Tisch</i>.</p>

  {id:'akkusativ', kind:'Grammatik', title:'Nominativ & Akkusativ', sub:'Who does it, and to what?',
   intro:`<p>In English, word order tells you who does what. In German, the <b>article</b> does. The job a noun has in the sentence is its <b>case</b>.</p>

  {id:'praep', kind:'Grammatik', title:'Präpositionen', sub:'Words that decide the case for you',
   intro:`<p>After a preposition you don’t need to ask Wer, Wen or Wem: the preposition decides the case.</p>
<div class="tablewrap"><table class="ct"><tr><th>always Akkusativ</th><th>always Dativ</th></tr>
<tr><td><b>durch</b> through<br><b>für</b> for<br><b>gegen</b> against<br><b>ohne</b> without<br><b>um</b> around / at (time)</td><td><b>aus</b> out of / from<br><b>bei</b> at / near<br><b>mit</b> with<br><b>nach</b> after / to<br><b>seit</b> since<br><b>von</b> from / of<br><b>zu</b> to</td></tr></table></div>
<p class="tip">Learn them as chants and say each one ten times out loud. Akkusativ: <b>durch, für, gegen, ohne, um</b>. Dativ: <b>aus, bei, mit, nach, seit, von, zu</b>.</p>
<p>Some merge with the article: zu dem → <b>zum</b>, zu der → <b>zur</b>, von dem → <b>vom</b>, bei dem → <b>beim</b>. <i>Ich gehe zum Arzt. Ich fahre zur Arbeit.</i></p>`,
   ex:[['Das Geschenk ist für den Vater.','The present is for the father.'],['Ich fahre mit dem Bus.','I go by bus.'],['Ich wohne bei meiner Tante.','I live at my aunt’s.'],['Ich gehe nie ohne mein Handy.','I never go without my phone.']],

  {id:'wechsel', kind:'Grammatik', title:'Wo? oder Wohin?', sub:'Two-way prepositions',
   intro:`<p>Nine prepositions can take <b>both</b> cases: <b>in, an, auf, unter, über, neben, hinter, vor, zwischen</b>. The question decides:</p>
<div class="tablewrap"><table class="ct"><tr><th>Wo? · where is it?</th><th>Wohin? · where to?</th></tr>
<tr><td>no movement → <b>Dativ</b></td><td>movement to a place → <b>Akkusativ</b></td></tr>
<tr><td><i>Das Buch liegt auf <span class="m">dem</span> Tisch.</i></td><td><i>Ich lege das Buch auf <span class="m">den</span> Tisch.</i></td></tr></table></div>
<p>The verbs come in pairs and help you: <i>liegen / legen</i> (lie / lay), <i>stehen / stellen</i> (stand / put upright), <i>sitzen / setzen</i> (sit / sit down).</p>
<p class="tip">Contractions: in dem → <b>im</b>, in das → <b>ins</b>, an dem → <b>am</b>, an das → <b>ans</b>. <i>Ich bin im Zimmer. Ich gehe ins Zimmer.</i></p>`,
   ex:[['Die Katze schläft unter dem Tisch.','The cat sleeps under the table.'],['Die Katze läuft unter den Tisch.','The cat runs under the table.'],['Ich stelle die Tasche neben das Sofa.','I put the bag next to the sofa.']],
   drills:[['prepcase',2,{kinds:['both']}],['art',8,{group:'wechsel',cases:['akk','dat'],arts:['def']}]]},
  {id:'possessiv', kind:'Grammatik', title:'mein, dein, sein …', sub:'Possessives take ein-endings',
   intro:`<div class="tablewrap"><table class="ct"><tr><td>ich → <b>mein</b></td><td>wir → <b>unser</b></td></tr><tr><td>du → <b>dein</b></td><td>ihr → <b>euer</b></td></tr><tr><td>er / es → <b>sein</b></td><td>sie (they) → <b>ihr</b></td></tr><tr><td>sie (she) → <b>ihr</b></td><td>Sie → <b>Ihr</b></td></tr></table></div>
<p>Good news: they take exactly the same endings as <b>ein</b>. So does <b>kein</b> (no / not a).</p>
<div class="tablewrap"><table class="ct"><tr><th></th><th class="m">masculine</th><th class="f">feminine</th><th class="n">neuter</th></tr>
<tr><td>Nominativ</td><td>mein</td><td>meine</td><td>mein</td></tr><tr><td>Akkusativ</td><td class="hlcell"><b>meinen</b></td><td>meine</td><td>mein</td></tr><tr><td>Dativ</td><td>meinem</td><td>meiner</td><td>meinem</td></tr></table></div>
<p class="tip">Two decisions. The <b>owner</b> picks the word (his → sein, her → ihr). The <b>noun</b> picks the ending (Vater is masculine → mein<b>en</b> Vater in the Akkusativ).</p>`,

// ---- dates, streak, spaced repetition ----
function dayKey(d){ const z = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function addDays(key, n){ const [y,m,d] = key.split('-').map(Number); return dayKey(new Date(y, m-1, d+n)); }
// met: {dayKey:true} for days the goal was reached. One streak freeze to start, +1 per 7 days (max 2).
function streakInfo(met, today){
  const keys = Object.keys(met).filter(k => met[k]).sort();
  const res = {streak:0, freezes:1, frozen:{}, todayDone: !!met[today]};
  if (!keys.length) return res;
  let streak = 0, bank = 1;
  for (let d = keys[0]; d < today; d = addDays(d, 1)){
    if (met[d]){ streak++; if (streak % 7 === 0) bank = Math.min(2, bank+1); }
    else if (streak > 0 && bank > 0){ bank--; res.frozen[d] = true; }
    else streak = 0;
  }
  if (met[today]) streak++;
  return Object.assign(res, {streak, freezes:bank});
}
const INTERVALS = [0,1,2,4,8,16,32,64];
function review(card, ok, today){
  const box = ok ? Math.min(card.b+1, INTERVALS.length-1) : 0;
  return {b:box, d: addDays(today, ok ? INTERVALS[box] : 0)};
}

     texts:[{h:'Elifs Blog: Mein Wochenende als Helferin beim Stadtfest', body:`Liebe Leserinnen und Leser,
letztes Wochenende war in unserer Stadt wieder das große Sommerfest am Fluss. Dieses Jahr habe ich nicht nur gefeiert, sondern zum ersten Mal als freiwillige Helferin mitgearbeitet. Meine Freundin Carla hatte mir davon erzählt, weil sie das schon seit drei Jahren macht.
Am Freitagabend gab es ein Treffen für alle Helfer. Dort haben wir unsere T-Shirts bekommen und erfahren, wo wir arbeiten sollen. Ich war am Informationsstand eingeteilt. Ehrlich gesagt war ich zuerst etwas enttäuscht, denn ich wäre lieber bei der Musikbühne gewesen. Aber am Ende war der Infostand genau richtig für mich: Ich habe Touristen den Weg erklärt, verlorene Kinder zu ihren Eltern gebracht und sogar einen Hund gefunden, der weggelaufen war.
Am Samstag hat es leider ab Mittag stark geregnet, und viele Besucher sind früh nach Hause gegangen. Der Sonntag war dafür sonnig und so voll wie nie. Ich habe insgesamt vierzehn Stunden gearbeitet und abends kaum noch meine Füße gespürt.
Geld bekommt man als Helferin übrigens nicht, aber Essen und Getränke waren gratis. Und nächstes Jahr? Da bin ich auf jeden Fall wieder dabei – vielleicht sogar an der Bühne!`}],
     items:[I('Elif hat dieses Jahr zum ersten Mal beim Stadtfest geholfen.','RF',0,0,'„zum ersten Mal als freiwillige Helferin“'),
       I('Elif hat im Internet von der Arbeit als Helferin erfahren.','RF',1,0,'Her friend Carla told her: „Meine Freundin Carla hatte mir davon erzählt.“'),
       I('Elif wollte von Anfang an am Informationsstand arbeiten.','RF',1,0,'„ich wäre lieber bei der Musikbühne gewesen“: she wanted the music stage.'),
       I('Am Informationsstand hat Elif auch Kindern geholfen.','RF',0,0,'„verlorene Kinder zu ihren Eltern gebracht“'),
       I('Am Samstag sind wegen des Wetters viele Leute früher gegangen.','RF',0,0,'„hat es … stark geregnet, und viele Besucher sind früh nach Hause gegangen“'),
       I('Die Helfer bekommen für ihre Arbeit Geld.','RF',1,0,'„Geld bekommt man als Helferin übrigens nicht“')]},
    {title:'Teil 2 · Zeitungsartikel · a/b/c', instr:'Lesen Sie die Texte und die Aufgaben 7 bis 12. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.',
     texts:[{h:'Bücher leihen um Mitternacht', body:`In der Stadtbibliothek Lindenau kann man seit diesem Monat auch dann Bücher ausleihen, wenn kein Personal da ist. Das neue Konzept heißt „Open Library“. Leser brauchen dafür nur ihren Bibliotheksausweis und eine PIN. Mit dem Ausweis öffnen sie die Tür, am Computer im Eingang leihen sie Bücher aus und geben sie wieder zurück. So ist die Bibliothek jeden Tag von 7 bis 23 Uhr geöffnet, auch am Sonntag.
Vorher war die Bibliothek nur an vier Tagen pro Woche geöffnet. „Viele Berufstätige und Studierende haben sich längere Öffnungszeiten gewünscht“, sagt die Leiterin Petra Haas. Entlassen wird trotzdem niemand: Die Mitarbeiter arbeiten weiterhin zu den bekannten Zeiten und beraten die Besucher. Am Abend sorgen Kameras für Sicherheit. Nach den ersten Wochen ist Haas sehr zufrieden. Besonders am Sonntagnachmittag kommen viele Familien.`},
       {h:'Großeltern hinter der Theke', body:`In einem kleinen Café in der Bremer Altstadt stehen keine jungen Baristas hinter der Theke, sondern Rentnerinnen und Rentner. Die Idee hatte Jana Krüger, 34. Ihre Großmutter hatte sich nach dem Tod des Großvaters sehr einsam gefühlt. „Sie hat immer gesagt: Ich möchte gebraucht werden“, erzählt Krüger.
Heute arbeiten zwölf Senioren zwischen 65 und 81 Jahren im „Café Zeitlos“. Jeder arbeitet nur zwei oder drei Stunden pro Tag, damit es nicht zu anstrengend wird. Die Kuchen backen sie nach eigenen Familienrezepten. Für ihre Arbeit bekommen sie einen kleinen Lohn, aber den meisten ist etwas anderes wichtiger: der Kontakt mit Menschen.
Die Gäste sind begeistert. Viele junge Leute kommen, weil sie sich gern mit den älteren Bedienungen unterhalten. Jetzt möchte Krüger ein zweites Café eröffnen. Sie sucht noch Senioren, die Lust haben mitzumachen.`}],
     items:[I('In der Stadtbibliothek Lindenau …',['kann man jetzt auch ohne Personal Bücher ausleihen.','gibt es nur noch Computer und keine Bücher.','braucht man keinen Ausweis mehr.'],0,0),
       I('Die Bibliothek hat die Öffnungszeiten geändert, weil …',['es zu wenig Mitarbeiter gibt.','viele Leser das wollten.','die Stadt Geld sparen möchte.'],1,0,'„Viele Berufstätige und Studierende haben sich längere Öffnungszeiten gewünscht.“'),
       I('Die Mitarbeiter der Bibliothek …',['verlieren ihre Arbeit.','arbeiten nur noch am Sonntag.','sind weiter zu den normalen Zeiten da.'],2,0,'„Entlassen wird trotzdem niemand … arbeiten weiterhin zu den bekannten Zeiten“'),
       I('Jana Krüger hatte die Idee für das Café, weil …',['ihre Großmutter allein und traurig war.','sie selbst nicht backen kann.','sie keine Arbeit gefunden hat.'],0,1,'„sehr einsam gefühlt“ = felt very lonely.'),
       I('Die Senioren im Café …',['arbeiten den ganzen Tag.','arbeiten nur wenige Stunden.','bekommen kein Geld.'],1,1,'„nur zwei oder drei Stunden pro Tag“'),
       I('Was ist für die meisten Senioren am wichtigsten?',['der Lohn','der Kontakt mit Menschen','die eigenen Rezepte'],1,1)]},
    {title:'Teil 3 · Anzeigen zuordnen', instr:'Lesen Sie die Situationen 13 bis 19 und die Anzeigen a bis j. Welche Anzeige passt zu welcher Situation? Sie können jede Anzeige nur einmal verwenden. Für eine Situation gibt es keine passende Anzeige. In diesem Fall wählen Sie 0.',
     texts:[['a','Kochschule Pfeffer: Asiatisch kochen mit Fisch und Fleisch. Jeden Dienstag 18–21 Uhr. Anmeldung online.'],
       ['b','Fahrradladen Speiche: Neue E-Bikes zu Sonderpreisen! Nur diesen Monat 20 % Rabatt.'],
       ['c','Business English am Abend: kleine Gruppen, erfahrene Lehrkräfte. Montag und Mittwoch 19–20.30 Uhr, Volkshochschule.'],
       ['d','Schwimmschule Delfin: Kurse für Kinder von 6 bis 10 Jahren, samstags 10 Uhr. Noch Plätze frei!'],
       ['e','Grünes Wochenende: vegetarische und vegane Küche für Anfänger. Samstag und Sonntag 11–16 Uhr, alle Zutaten inklusive.'],
       ['f','Verkaufe mein Stadtrad, 3 Jahre alt, guter Zustand, 120 €. Abholen in der Nordstraße.'],
       ['g','Salsa-Party im Club Havanna: jeden Samstag ab 21 Uhr. Um 20 Uhr Tanzkurs für Anfänger inklusive!'],
       ['h','Bäckerei Korn sucht Aushilfe für Samstag und Sonntag, 6–12 Uhr. Gute Bezahlung.'],
       ['i','Schwimmkurse für Erwachsene: Endlich ohne Angst im Wasser! Donnerstag 19 Uhr.'],
       ['j','Englisch für Kinder: spielerisch lernen mit Liedern und Spielen. Freitag 15 Uhr.']].map(([h,body]) => ({h, body})),
     items:[I('Ihre Freundin möchte am Wochenende einen Kochkurs für vegetarisches Essen machen.',ADS,4,-1,'e: vegetarisch, Samstag und Sonntag. (a has fish and meat, on Tuesday.)'),
       I('Ein Kollege sucht ein gebrauchtes Fahrrad für den Weg zur Arbeit.',ADS,5,-1,'f: a used bike. (b sells new e-bikes.)'),
       I('Ihr Nachbar möchte sein Englisch für den Beruf verbessern, hat aber nur abends Zeit.',ADS,2,-1,'c: Business English, in the evening. (j is for children.)'),
       I('Eine Bekannte sucht einen Schwimmkurs für ihren Sohn (8 Jahre).',ADS,3,-1,'d: children 6–10. (i is for adults.)'),
       I('Sie möchten am Samstag mit Freunden tanzen gehen.',ADS,6,-1,'g: Salsa-Party every Saturday.'),
       I('Ihre Schwester sucht einen Nebenjob am Wochenende.',ADS,7,-1,'h: Aushilfe = temporary helper, Saturday and Sunday.'),
       I('Ein Freund möchte günstig seine Waschmaschine reparieren lassen.',ADS,10,-1,'No ad offers repairs, so the answer is 0.')]},
    {title:'Teil 4 · Meinungen · Ja/Nein', instr:'Lesen Sie die Texte 20 bis 26. Wählen Sie: Ist die Person für ein eigenes Handy für Kinder in der Grundschule?\nIn einer Zeitschrift lesen Sie Kommentare zu einem Artikel über Kinder und Smartphones.',
     texts:[['Markus, 41, Leipzig','Mein Sohn fährt jeden Tag allein mit dem Bus zur Schule. Seit er ein Handy hat, kann er mich anrufen, wenn der Bus Verspätung hat. Das beruhigt mich sehr. Natürlich haben wir klare Regeln: kein Handy beim Essen und nicht im Bett.'],
       ['Sandra, 36, Köln','Kinder in diesem Alter sollten draußen spielen und Freunde treffen. Mit einem Smartphone sitzen sie nur noch vor dem Bildschirm. Wenn meine Tochter mich erreichen muss, kann sie das Telefon im Sekretariat der Schule benutzen.'],
       ['Yusuf, 29, Hamburg','Ich bin Lehrer und sehe jeden Tag, wie Kinder in Klassenchats gemobbt werden. Ein Smartphone hat in der Grundschule nichts zu suchen. Mit zwölf oder dreizehn ist früh genug.'],
       ['Petra, 52, München','Ich war zuerst dagegen, aber heute sehe ich das anders. Meine Enkelin lernt mit Apps Englisch und schickt mir Fotos aus dem Urlaub. Wichtig ist nur, dass die Eltern wissen, was das Kind mit dem Handy macht.'],
       ['Leon, 17, Berlin','Ich hatte mein erstes Handy mit neun und habe viel zu viel Zeit mit Spielen verbracht. Meine Noten wurden schlechter. Meinen kleinen Geschwistern würde ich raten, noch ein paar Jahre zu warten.'],
       ['Aylin, 33, Stuttgart','Heute läuft so viel über das Handy: Verabredungen, Hausaufgaben, Infos von der Schule. Ein Kind ohne Handy ist schnell ausgeschlossen. Deshalb hat mein Sohn mit acht eins bekommen, natürlich mit einer Kinderschutz-App.'],
       ['Thomas, 45, Dresden','Ich verstehe beide Seiten, aber am Ende entscheide ich mich dagegen. Zu viele Gefahren, zu wenig Kontrolle. Meine Kinder bekommen erst in der weiterführenden Schule ein Handy.']].map(([h,body]) => ({h, body})),
     items:[I('Markus','JN',0,0,'He feels reassured because his son can call him.'),I('Sandra','JN',1,1,'Children should play outside instead.'),I('Yusuf','JN',1,2,'„hat in der Grundschule nichts zu suchen“ = doesn’t belong in primary school.'),
       I('Petra','JN',0,3,'„Ich war zuerst dagegen, aber heute sehe ich das anders.“'),I('Leon','JN',1,4,'He would tell his siblings to wait.'),I('Aylin','JN',0,5,'Her son got one at eight.'),I('Thomas','JN',1,6,'„entscheide ich mich dagegen“')]},
    {title:'Teil 5 · Regeln · a/b/c', instr:'Lesen Sie die Aufgaben 27 bis 30 und den Text dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.\nSie interessieren sich für einen Deutschkurs und lesen die Teilnahmebedingungen der Sprachschule.',
     texts:[{h:'Sprachschule Lingua: Teilnahmebedingungen', body:`Anmeldung: Sie können sich online oder im Sekretariat anmelden. Vor Ihrem ersten Kurs machen Sie einen kostenlosen Einstufungstest. Nur so können wir Ihnen den richtigen Kurs empfehlen.
Bezahlung: Die Kursgebühr bezahlen Sie spätestens eine Woche vor Kursbeginn. Wenn Sie den ganzen Kurs im Voraus bezahlen, erhalten Sie 5 % Rabatt. Ratenzahlung ist nach Absprache möglich.
Abmeldung: Wenn Sie nicht teilnehmen können, melden Sie sich bitte schriftlich ab. Bis 14 Tage vor Kursbeginn bekommen Sie das ganze Geld zurück. Danach berechnen wir 50 % der Kursgebühr. Nach Kursbeginn ist keine Rückzahlung möglich.
Fehlzeiten: Wenn Sie krank sind, informieren Sie bitte Ihre Kursleitung. Für eine Teilnahmebestätigung müssen Sie an mindestens 80 % der Unterrichtsstunden teilgenommen haben.
Unterrichtsausfall: Fällt eine Stunde wegen Krankheit der Kursleitung aus, holen wir sie am Ende des Kurses nach.`}],
     items:[I('Bevor man einen Kurs beginnt, …',['muss man einen Test machen.','muss man einen Rabatt beantragen.','muss man den Test bezahlen.'],0,0,'„Vor Ihrem ersten Kurs machen Sie einen kostenlosen Einstufungstest.“'),
       I('Wer sich 10 Tage vor Kursbeginn abmeldet, …',['bekommt das ganze Geld zurück.','bezahlt die Hälfte der Kursgebühr.','bekommt kein Geld zurück.'],1,0,'Less than 14 days before the start → 50 %.'),
       I('Eine Teilnahmebestätigung bekommt man, wenn man …',['den ganzen Kurs bezahlt hat.','bei mindestens 80 % der Stunden da war.','nie krank war.'],1,0),
       I('Wenn die Kursleiterin krank ist, …',['fällt die Stunde einfach aus.','bekommt man Geld zurück.','wird die Stunde später nachgeholt.'],2,0,'„holen wir sie am Ende des Kurses nach“ = made up later.')]},
  ]},
  hoeren:{name:'Hören', min:40, teile:[
    {title:'Teil 1 · Kurze Texte (2×)', instr:'Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung.',
     audio:[
       {label:'Text 1', plays:2, lines:[['Katja','Hallo Sven, hier ist Katja. Du, ich muss unser Treffen heute Abend leider absagen. Meine Chefin hat mich gebeten, länger zu bleiben, weil morgen ein wichtiger Kunde kommt. Können wir uns stattdessen am Donnerstag treffen? Um sieben im Restaurant am Markt? Wenn das nicht geht, ruf mich einfach an. Tschüss!']]},
       {label:'Text 2', plays:2, lines:[['Durchsage','Liebe Fahrgäste, wegen einer Störung an einem Signal hat der ICE nach Hamburg heute etwa 25 Minuten Verspätung. Fahrgäste mit Anschluss nach Kiel nehmen bitte den Regionalexpress um 14 Uhr 12 von Gleis 7. Ihre Fahrkarte gilt auch für diesen Zug. Wir bitten um Entschuldigung.']]},
       {label:'Text 3', plays:2, lines:[['Radio','Und nun das Wetter für das Wochenende. Am Samstag bleibt es im Norden trocken und sonnig bei Temperaturen bis 24 Grad. Im Süden gibt es am Nachmittag Gewitter. Am Sonntag wird es überall kühler, und es regnet immer wieder. Wer einen Ausflug plant, sollte das am Samstag tun.']]},
       {label:'Text 4', plays:2, lines:[['Ansage','Guten Tag, Sie sind verbunden mit der Praxis Dr. Albers. Unsere Praxis ist vom 4. bis zum 15. August wegen Urlaub geschlossen. In dringenden Fällen gehen Sie bitte zu unserer Vertretung, Frau Dr. Mertens, in der Bahnhofstraße 12. Rezepte können Sie ab dem 18. August wieder bei uns abholen.']]},
       {label:'Text 5', plays:2, lines:[['Durchsage','Liebe Kundinnen und Kunden, nur heute in unserer Obstabteilung: Erdbeeren aus der Region, das Kilo für nur 3 Euro 99. Und vergessen Sie nicht: Ab nächster Woche haben wir montags bis samstags bis 22 Uhr für Sie geöffnet. Vielen Dank für Ihren Einkauf.']]}],
     items:[I('Katja kann heute Abend nicht kommen.','RF',0,0,'„ich muss unser Treffen heute Abend leider absagen“'),
       I('Katja schlägt vor, sich … zu treffen.',['am Donnerstag um 19 Uhr','morgen beim Kunden','heute später im Restaurant'],0,0),
       I('Der Zug nach Hamburg fällt heute aus.','RF',1,1,'It is 25 minutes late (Verspätung), not cancelled (ausfallen).'),
       I('Reisende nach Kiel sollen …',['eine neue Fahrkarte kaufen.','den Zug um 14:12 Uhr nehmen.','bis 15 Uhr warten.'],1,1,'„Ihre Fahrkarte gilt auch für diesen Zug.“'),
       I('Am Samstag gibt es im Süden Gewitter.','RF',0,2),
       I('Wie wird das Wetter am Sonntag?',['sonnig und warm','kühler und mit Regen','trocken im Norden'],1,2),
       I('Die Praxis ist fast zwei Wochen geschlossen.','RF',0,3,'From 4 to 15 August.'),
       I('In dringenden Fällen soll man …',['ins Krankenhaus fahren.','zu Frau Dr. Mertens gehen.','bis zum 18. August warten.'],1,3),
       I('Die Erdbeeren sind die ganze Woche billiger.','RF',1,4,'„nur heute“ = only today.'),
       I('Was ändert sich ab nächster Woche?',['Der Supermarkt ist länger geöffnet.','Der Supermarkt ist auch sonntags geöffnet.','Es gibt keine Erdbeeren mehr.'],0,4,'„montags bis samstags bis 22 Uhr“')]},
    {title:'Teil 2 · Führung (1×)', instr:'Sie hören nun einen Text. Sie hören den Text einmal. Dazu lösen Sie fünf Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung.\nSie nehmen an einer Führung durch einen Betrieb teil.',
     audio:[{label:'Führung', plays:1, lines:[['Frau Lange',`Herzlich willkommen bei der Bäckerei Hansen! Mein Name ist Andrea Lange. Ich bin hier für die Ausbildung zuständig und führe Sie heute durch unseren Betrieb. Die Führung dauert ungefähr eine Stunde. Bitte ziehen Sie zuerst die weißen Mäntel und die Haarnetze an. Hygiene ist bei uns sehr wichtig.
Unser Betrieb wurde 1962 von Karl Hansen gegründet. Damals war es eine kleine Bäckerei mit drei Mitarbeitern. Heute haben wir zwölf Filialen in der Stadt und über 150 Beschäftigte.
Wir beginnen jetzt in der Backstube. Hier fängt die Arbeit schon um zwei Uhr nachts an. Ich weiß, das klingt hart. Aber unsere Bäcker sind dafür meistens schon um elf Uhr fertig und haben den ganzen Nachmittag frei.
Jedes Jahr bilden wir acht junge Leute aus: als Bäcker, als Verkäufer und im Büro. Viele unserer Auszubildenden kommen übrigens aus dem Ausland, zurzeit aus Syrien, Marokko und Vietnam.
Am Ende der Führung gehen wir in unser Café. Dort dürfen Sie unsere Brötchen und Kuchen probieren. Und wenn Sie Interesse an einem Praktikum haben, nehmen Sie bitte einen Flyer mit.`]]}],
     items:[I('Frau Lange ist …',['die Chefin der Bäckerei.','für die Auszubildenden zuständig.','Verkäuferin im Café.'],1,0,'„Ich bin hier für die Ausbildung zuständig.“'),
       I('Was müssen die Besucher zuerst machen?',['Brötchen probieren','besondere Kleidung anziehen','einen Flyer mitnehmen'],1,0,'„Bitte ziehen Sie zuerst die weißen Mäntel und die Haarnetze an.“'),
       I('Heute hat die Bäckerei …',['drei Mitarbeiter.','zwölf Mitarbeiter.','mehr als 150 Mitarbeiter.'],2,0,'Twelve is the number of shops (Filialen).'),
       I('Die Bäcker …',['arbeiten nur nachmittags.','beginnen sehr früh und haben nachmittags frei.','arbeiten bis zwei Uhr nachts.'],1,0),
       I('Am Ende der Führung …',['bekommen alle einen Praktikumsplatz.','gehen die Besucher ins Café.','besuchen alle eine Filiale.'],1,0)]},
    {title:'Teil 3 · Gespräch (1×)', instr:'Sie hören nun ein Gespräch. Sie hören das Gespräch einmal. Dazu lösen Sie sieben Aufgaben. Wählen Sie: Sind die Aussagen Richtig oder Falsch?\nSie sitzen im Bus und hören, wie sich zwei Freunde unterhalten.',
     audio:[{label:'Gespräch', plays:1, lines:[['Nina','Hey Ben! Lange nicht gesehen! Wie geht’s dir?'],['Ben','Hallo Nina! Gut, danke. Ich bin gerade auf dem Weg zu meinem neuen Job.'],['Nina','Ein neuer Job? Erzähl mal!'],
       ['Ben','Ich arbeite seit zwei Wochen in einem Hotel an der Rezeption. Vorher war ich ja im Supermarkt an der Kasse.'],['Nina','Und? Gefällt es dir besser?'],
       ['Ben','Viel besser! Ich kann endlich mein Englisch und mein Spanisch benutzen. Gestern war eine ganze Gruppe aus Mexiko da.'],['Nina','Toll! Aber arbeitest du dann nicht auch nachts?'],
       ['Ben','Ja, manchmal. Eine Woche im Monat habe ich Nachtschicht. Das ist anstrengend, aber dafür verdiene ich mehr.'],['Nina','Ich weiß nicht, ob ich das könnte. Ich brauche meinen Schlaf.'],
       ['Ben','Und du? Studierst du noch Medizin?'],['Nina','Nein, ich habe gewechselt. Ich mache jetzt eine Ausbildung zur Pflegefachfrau. Das Studium war mir zu theoretisch.'],
       ['Ben','Wirklich? Und bist du zufrieden?'],['Nina','Total. Ich bin jeden Tag im Krankenhaus und lerne direkt mit den Patienten. Nur das frühe Aufstehen ist schlimm. Mein Dienst beginnt um sechs.'],
       ['Ben','Na, dann sind wir ja beide keine Langschläfer mehr! Oh, ich muss hier aussteigen. Lass uns bald mal einen Kaffee trinken!'],['Nina','Gerne! Ich schreib dir.']]}],
     items:[I('Ben arbeitet schon seit zwei Monaten im Hotel.','RF',1,0,'„seit zwei Wochen“'),I('Vorher hat Ben in einem Supermarkt gearbeitet.','RF',0,0),
       I('Im Hotel kann Ben Fremdsprachen sprechen.','RF',0,0,'„mein Englisch und mein Spanisch benutzen“'),I('Ben arbeitet jede Woche nachts.','RF',1,0,'„Eine Woche im Monat“'),
       I('Nina studiert noch Medizin.','RF',1,0,'„Nein, ich habe gewechselt.“'),I('Nina gefällt ihre Ausbildung.','RF',0,0,'„Total.“'),I('Ninas Arbeit beginnt am Morgen sehr früh.','RF',0,0,'„Mein Dienst beginnt um sechs.“')]},
    {title:'Teil 4 · Diskussion (2×)', instr:'Sie hören nun eine Diskussion. Sie hören die Diskussion zweimal. Dazu lösen Sie acht Aufgaben. Ordnen Sie die Aussagen zu: Wer sagt was?\nDie Moderatorin der Radiosendung „Leben heute“ diskutiert mit Frau Brandt, Personalchefin, und Herrn Okafor, Auszubildender, über die Vier-Tage-Woche.',
     audio:[{label:'Diskussion', plays:2, lines:[['Moderatorin','Herzlich willkommen zu „Leben heute“. Unser Thema ist die Vier-Tage-Woche. Immer mehr Firmen probieren sie aus. Frau Brandt, Ihre Firma macht da mit. Wie funktioniert das?'],
       ['Frau Brandt','Bei uns arbeiten die Mitarbeiter seit einem Jahr nur noch von Montag bis Donnerstag, dafür aber jeden Tag neun Stunden. Am Ende arbeiten sie etwas weniger als vorher, bekommen aber das gleiche Gehalt.'],
       ['Moderatorin','Und das lohnt sich für die Firma?'],
       ['Frau Brandt','Ja, das hat uns selbst überrascht. Die Leute sind seltener krank und motivierter. Und wir finden leichter neue Mitarbeiter. Das ist heute ein großer Vorteil.'],
       ['Moderatorin','Herr Okafor, Sie machen eine Ausbildung als Mechatroniker. Wie sehen Sie das?'],
       ['Herr Okafor','Ehrlich gesagt bin ich nicht so begeistert. Neun Stunden in der Werkstatt sind sehr lang. Am Donnerstagabend bin ich total kaputt.'],
       ['Moderatorin','Aber dafür haben Sie ein langes Wochenende.'],
       ['Herr Okafor','Das stimmt, und das genieße ich auch. Ich besuche oft meine Familie in Frankfurt. Aber für das Lernen ist es schwierig. Nach so einem langen Tag kann ich mich abends nicht mehr auf die Berufsschule konzentrieren.'],
       ['Frau Brandt','Das ist ein wichtiger Punkt. Für Auszubildende sollte man vielleicht andere Lösungen finden, zum Beispiel einen freien Lerntag am Freitag.'],
       ['Moderatorin','Glauben Sie, dass die Vier-Tage-Woche in Zukunft normal wird?'],
       ['Herr Okafor','In Büros vielleicht. Aber im Handwerk oder im Krankenhaus? Da müssen die Kunden und Patienten ja trotzdem jeden Tag versorgt werden.'],
       ['Frau Brandt','Ich denke, in zehn Jahren gibt es viel mehr Firmen mit flexiblen Modellen. Wer gute Leute will, muss ihnen etwas bieten.'],
       ['Moderatorin','Vielen Dank Ihnen beiden für das Gespräch!']]}],
     items:(() => { const W = ['Moderatorin','Frau Brandt','Herr Okafor']; return [
       I('Viele Firmen testen die Vier-Tage-Woche.',W,0,0,'„Immer mehr Firmen probieren sie aus.“'),
       I('Bei der Vier-Tage-Woche bekommt man das gleiche Geld.',W,1,0,'„bekommen aber das gleiche Gehalt“'),
       I('Mit der Vier-Tage-Woche findet eine Firma leichter Personal.',W,1,0),
       I('Lange Arbeitstage sind sehr anstrengend.',W,2,0,'„Am Donnerstagabend bin ich total kaputt.“'),
       I('Nach der Arbeit ist es schwer, für die Schule zu lernen.',W,2,0),
       I('Für Auszubildende könnte ein freier Lerntag helfen.',W,1,0),
       I('In manchen Berufen ist die Vier-Tage-Woche schwer möglich.',W,2,0,'„im Handwerk oder im Krankenhaus?“'),

EXAM.lesen.teile2 = [
  {title:'Teil 1 · Blog · Richtig/Falsch', instr:'Lesen Sie den Text und die Aufgaben 1 bis 6. Wählen Sie: Sind die Aussagen Richtig oder Falsch?',
   texts:[{h:'Mariams Blog: Vier Wochen in der Autowerkstatt', body:`Hallo zusammen,
seit vier Wochen mache ich ein Praktikum in einer Autowerkstatt in Bielefeld. Viele Leute sind überrascht, wenn ich das erzähle, weil man in Werkstätten immer noch wenige Frauen sieht. Aber ich wollte schon als Kind wissen, wie ein Motor funktioniert. Mein Vater hat am Wochenende oft sein altes Auto repariert, und ich durfte ihm helfen.
Den Praktikumsplatz habe ich über meine Berufsberaterin bei der Agentur für Arbeit gefunden. Sie hat mir drei Betriebe empfohlen, und schon beim ersten Vorstellungsgespräch hat es geklappt.
Die ersten Tage waren nicht leicht. Ich musste vor allem aufräumen und Werkzeug holen, und abends tat mir der Rücken weh. Aber mein Kollege Stefan hat mir viel erklärt, und inzwischen darf ich schon allein Reifen wechseln und das Öl kontrollieren.
Am meisten gefällt mir das Team. Wir machen jeden Mittag zusammen Pause, und am Freitag bringt immer jemand Kuchen mit. Nur an die Arbeitszeit muss ich mich noch gewöhnen: Wir fangen um halb sieben an.
Letzte Woche hat mein Chef gesagt, dass ich nach dem Praktikum bei ihnen eine Ausbildung anfangen kann. Ich habe sofort Ja gesagt!`}],
   items:[I('Mariam macht seit ungefähr einem Monat ein Praktikum.','RF',0,0,'„seit vier Wochen“'),
     I('In Autowerkstätten arbeiten heute genauso viele Frauen wie Männer.','RF',1,0,'„weil man in Werkstätten immer noch wenige Frauen sieht“'),
     I('Mariam hat den Praktikumsplatz mit Hilfe einer Beraterin gefunden.','RF',0,0,'„über meine Berufsberaterin bei der Agentur für Arbeit“'),
     I('Schon in der ersten Woche durfte Mariam allein Reifen wechseln.','RF',1,0,'First she only tidied up and fetched tools. „inzwischen“ = by now.'),
     I('Mariam gefällt die Stimmung im Team.','RF',0,0,'„Am meisten gefällt mir das Team.“'),
     I('Nach dem Praktikum möchte Mariam in einem anderen Betrieb arbeiten.','RF',1,0,'She can start an Ausbildung there and said yes.')]},
  {title:'Teil 2 · Zeitungsartikel · a/b/c', instr:'Lesen Sie die Texte und die Aufgaben 7 bis 12. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.',
   texts:[{h:'Reparieren statt wegwerfen', body:`Jeden ersten Samstag im Monat wird das Gemeindehaus in Kassel-Nord zur Werkstatt. Dann kommen Menschen mit kaputten Toastern, Lampen, Fahrrädern oder Hosen ins „Repair-Café“. Ehrenamtliche Helfer – Elektriker, Schneiderinnen, Fahrradmechaniker – reparieren die Sachen zusammen mit den Besitzern. Die Reparatur kostet nichts, aber viele Besucher geben eine kleine Spende für Kaffee und Ersatzteile.
„Wir wollen nicht nur Müll vermeiden“, sagt Organisator Klaus Becker, 67. „Die Leute sollen auch lernen, wie sie Dinge selbst reparieren können.“ Deshalb arbeiten die Besucher selbst mit, und die Helfer erklären.
Nicht alles kann gerettet werden: Bei etwa jedem dritten Gerät fehlen Ersatzteile, oder die Reparatur ist zu kompliziert. Trotzdem ist das Café jeden Monat voll. Weil so viele Menschen kommen, sucht Becker jetzt weitere Helfer, besonders für Computer und Handys.`},
     {h:'Ein Dorf kauft seinen Laden', body:`Als vor zwei Jahren der letzte Supermarkt im Dorf Wiesental geschlossen hat, mussten die 900 Einwohner für jedes Brot zwölf Kilometer in die nächste Stadt fahren. Für ältere Menschen ohne Auto war das ein großes Problem. Deshalb haben die Bürger eine Genossenschaft gegründet: 240 Familien haben je 250 Euro bezahlt, und mit dem Geld haben sie einen eigenen Dorfladen eröffnet.
Heute gibt es dort Lebensmittel, viele davon von Bauern aus der Region, eine kleine Post und eine Kaffee-Ecke. Zwei Verkäuferinnen sind fest angestellt, außerdem helfen Rentner aus dem Dorf stundenweise mit.
„Der Laden ist mehr als ein Geschäft“, sagt Bürgermeisterin Anna Roth. „Hier treffen sich die Leute wieder.“ Leicht ist es aber nicht: Die Preise sind etwas höher als im Supermarkt, und nicht alle Einwohner kaufen regelmäßig im Dorf ein.`}],
   items:[I('Im Repair-Café …',['reparieren die Helfer die Sachen zusammen mit den Besuchern.','kann man gebrauchte Geräte kaufen.','arbeiten nur Elektriker.'],0,0,'„reparieren die Sachen zusammen mit den Besitzern“'),
     I('Für eine Reparatur …',['bezahlt man einen festen Preis.','muss man nichts bezahlen.','muss man Ersatzteile mitbringen.'],1,0,'„Die Reparatur kostet nichts“. A donation is voluntary.'),
     I('Klaus Becker sucht neue Helfer, weil …',['viele Helfer aufgehört haben.','jedes dritte Gerät kaputt bleibt.','sehr viele Besucher kommen.'],2,0,'„Weil so viele Menschen kommen, sucht Becker jetzt weitere Helfer“'),
     I('Vor zwei Jahren …',['hat im Dorf ein neuer Supermarkt eröffnet.','gab es im Dorf kein Geschäft mehr.','sind viele Einwohner in die Stadt gezogen.'],1,1,'The last supermarket closed.'),
     I('Den Dorfladen …',['haben die Bürger gemeinsam bezahlt.','hat eine Supermarktkette gekauft.','bezahlt die Stadt.'],0,1,'„240 Familien haben je 250 Euro bezahlt“'),
     I('Ein Problem für den Laden ist, dass …',['er keine Verkäuferinnen findet.','es dort keine Produkte aus der Region gibt.','nicht alle Einwohner dort einkaufen.'],2,1,'„nicht alle Einwohner kaufen regelmäßig im Dorf ein“')]},
  {title:'Teil 3 · Anzeigen zuordnen', instr:'Lesen Sie die Situationen 13 bis 19 und die Anzeigen a bis j. Welche Anzeige passt zu welcher Situation? Sie können jede Anzeige nur einmal verwenden. Für eine Situation gibt es keine passende Anzeige. In diesem Fall wählen Sie 0.',
   texts:[['a','Tanzschule Rhythmus: Hochzeitstanz-Crashkurs für Paare. 3 Abende, freitags 19–21 Uhr.'],
     ['b','Möbel Kraft: Lieferung und Aufbau Ihrer neuen Küche – kostenlos bei jedem Kauf über 2000 €.'],
     ['c','Studentin hilft beim Umzug: Kisten packen, tragen, Möbel aufbauen. 15 € pro Stunde, auch am Wochenende.'],
     ['d','Nachhilfe in Mathe und Physik für Schüler der Klassen 5 bis 10. Erfahrener Lehrer, auch online.'],
     ['e','Computerkurs für Senioren: E-Mails schreiben, Fotos verschicken, sicher im Internet. Dienstag 10 Uhr, Stadtbücherei.'],
     ['f','Yoga im Park: jeden Sonntag 9 Uhr, für alle Niveaus, kostenlos. Bitte eigene Matte mitbringen.'],
     ['g','Transporter mieten ab 39 € pro Tag – ideal für Umzüge. Autovermietung Blitz, Hauptstraße 5.'],
     ['h','Deutsch für den Beruf B1/B2: Bewerbungen schreiben, Telefongespräche und Vorstellungsgespräche üben. Abends, Volkshochschule.'],
     ['i','Fitnessstudio Power: Probetraining gratis, Sauna inklusive, 24 Stunden geöffnet.'],
     ['j','Mathe-Spielgruppe für Kinder von 4 bis 6 Jahren: Zahlen entdecken mit Spielen. Mittwoch 15 Uhr.']].map(([h,body]) => ({h, body})),
   items:[I('Ein Freund zieht um. Er möchte selbst fahren, braucht aber ein großes Auto.',ADS,6,-1,'g: rent a van. (c is a person who helps, not a car.)'),
     I('Ihre Nachbarin möchte lernen, wie sie ihren Enkeln Fotos per E-Mail schickt.',ADS,4,-1,'e: computer course for seniors.'),
     I('Ihr Kollege möchte Vorstellungsgespräche auf Deutsch üben.',ADS,7,-1,'h: German for work, job interviews.'),
     I('Eine Bekannte sucht für ihre Tochter (12 Jahre) Hilfe in Mathematik.',ADS,3,-1,'d: classes 5 to 10. (j is for children aged 4 to 6.)'),
     I('Sie möchten am Wochenende draußen Sport machen und dafür nichts bezahlen.',ADS,5,-1,'f: outdoors, Sunday, free. (i is indoors and not free.)'),
     I('Ihre Schwester sucht jemanden, der die Möbel in ihre neue Wohnung trägt.',ADS,2,-1,'c: help with moving, carrying furniture.'),

  {title:'Teil 4 · Meinungen · Ja/Nein', instr:'Lesen Sie die Texte 20 bis 26. Wählen Sie: Ist die Person dafür, dass Geschäfte auch am Sonntag öffnen dürfen?\nIn einer Zeitung lesen Sie Kommentare zu einem Artikel über Ladenöffnungszeiten.',
   texts:[['Jonas, 27, Frankfurt','Ich arbeite unter der Woche bis 19 Uhr, und am Samstag ist der Supermarkt immer total voll. Wenn ich am Sonntag in Ruhe einkaufen könnte, wäre das für mich eine große Erleichterung.'],
     ['Gabriele, 58, Freiburg','Ich arbeite seit dreißig Jahren als Verkäuferin. Der Sonntag ist der einzige Tag, an dem meine ganze Familie zusammen ist. Den möchte ich nicht verlieren.'],
     ['Murat, 35, Essen','Ich habe einen kleinen Kiosk. Wenn die großen Supermärkte auch sonntags öffnen, kommt niemand mehr zu mir. Für kleine Geschäfte wäre das das Ende.'],
     ['Lena, 22, Berlin','In vielen Ländern ist das ganz normal, und niemand hat ein Problem damit. Außerdem gibt es viele Studierende wie mich, die gern am Sonntag ein paar Stunden arbeiten würden.'],
     ['Herbert, 71, Kassel','Früher war ich strikt dagegen. Aber seit ich allein lebe, freue ich mich über jeden Ort, an dem Menschen sind. Ein offenes Geschäft am Sonntag wäre für mich keine schlechte Sache.'],
     ['Sofia, 40, Hannover','Wir brauchen einen Tag in der Woche, an dem nicht alles ums Kaufen geht. Am Sonntag gehe ich mit meinen Kindern lieber in den Wald als ins Einkaufszentrum.'],
     ['David, 31, Nürnberg','Am Anfang fand ich die Idee praktisch. Aber dann habe ich mit meiner Schwester gesprochen, die im Supermarkt arbeitet. Sie müsste dann jedes zweite Wochenende arbeiten. Nein, das geht zu weit.']].map(([h,body]) => ({h, body})),
   items:[I('Jonas','JN',0,0,'Shopping on Sunday would make his life easier.'),I('Gabriele','JN',1,1,'She wants to keep Sunday for her family.'),I('Murat','JN',1,2,'It would be the end for small shops like his kiosk.'),
     I('Lena','JN',0,3,'It is normal elsewhere, and students would like to work on Sundays.'),I('Herbert','JN',0,4,'„Früher war ich strikt dagegen. Aber …“: he changed his mind.'),
     I('Sofia','JN',1,5,'Sunday should not be about shopping.'),I('David','JN',1,6,'„Am Anfang fand ich die Idee praktisch. Aber …“: he changed his mind and is against it.')]},
  {title:'Teil 5 · Regeln · a/b/c', instr:'Lesen Sie die Aufgaben 27 bis 30 und den Text dazu. Wählen Sie bei jeder Aufgabe die richtige Lösung a, b oder c.\nSie sind in eine neue Wohnung gezogen und lesen die Hausordnung.',
   texts:[{h:'Hausordnung · Lindenstraße 14', body:`Ruhezeiten: Von 22 bis 6 Uhr und sonntags den ganzen Tag ist Ruhe im Haus. Laute Musik und Bohren sind in dieser Zeit nicht erlaubt. Wenn Sie eine Feier planen, informieren Sie bitte vorher Ihre Nachbarn.
Treppenhaus: Das Treppenhaus wird jede Woche von einer Firma geputzt. Fahrräder, Kinderwagen und Schuhe dürfen dort nicht stehen, weil sie den Fluchtweg blockieren. Für Fahrräder gibt es einen Raum im Keller.
Müll: Bitte trennen Sie den Müll: Papier, Verpackungen, Glas und Restmüll. Glas bringen Sie bitte zum Container an der Ecke Lindenstraße/Parkweg. Sperrmüll, zum Beispiel alte Möbel, darf nicht neben die Mülltonnen gestellt werden. Melden Sie ihn bei der Stadt an.
Waschküche: Die Waschmaschinen im Keller können Sie montags bis samstags von 8 bis 20 Uhr benutzen. Tragen Sie sich bitte vorher in die Liste an der Tür ein.
Schäden: Wenn in Ihrer Wohnung etwas kaputt ist, melden Sie es bitte sofort der Hausverwaltung.`}],
   items:[I('Am Sonntag …',['darf man nicht bohren.','darf man bis 22 Uhr laute Musik hören.','wird das Treppenhaus geputzt.'],0,0,'„sonntags den ganzen Tag ist Ruhe … Bohren … nicht erlaubt“'),
     I('Wo sollen die Bewohner ihre Fahrräder abstellen?',['im Treppenhaus','im Keller','vor der Haustür'],1,0,'„Für Fahrräder gibt es einen Raum im Keller.“'),
     I('Ein altes Sofa …',['kann man neben die Mülltonnen stellen.','bringt man zum Container an der Ecke.','muss man bei der Stadt anmelden.'],2,0,'Sperrmüll (bulky waste): „Melden Sie ihn bei der Stadt an.“'),
     I('Wer die Waschmaschine benutzen möchte, …',['kann das auch am Sonntag tun.','muss sich vorher in eine Liste eintragen.','muss die Hausverwaltung anrufen.'],1,0,'„Tragen Sie sich bitte vorher in die Liste an der Tür ein.“')]},
];
EXAM.hoeren.teile2 = [
  {title:'Teil 1 · Kurze Texte (2×)', instr:'Sie hören nun fünf kurze Texte. Sie hören jeden Text zweimal. Zu jedem Text lösen Sie zwei Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung.',
   audio:[
     {label:'Text 1', plays:2, lines:[['Herr Schulz','Guten Tag, Frau Yilmaz, hier spricht Schulz von der Autowerkstatt Schulz. Ihr Auto ist fertig. Wir haben die Bremsen erneuert, und das Licht hinten links funktioniert auch wieder. Sie können den Wagen heute bis 18 Uhr abholen. Morgen haben wir leider geschlossen, ab Montag sind wir dann wieder ab 7 Uhr für Sie da. Sie können bar oder mit Karte bezahlen. Auf Wiederhören!']]},
     {label:'Text 2', plays:2, lines:[['Durchsage','Achtung, eine Information für alle Fahrgäste der S-Bahn-Linie 3: Wegen Bauarbeiten fahren am Wochenende zwischen Hauptbahnhof und Flughafen keine Züge. Bitte benutzen Sie die Ersatzbusse. Sie fahren alle 15 Minuten vor dem Hauptbahnhof, Ausgang Nord, ab. Rechnen Sie mit etwa 20 Minuten längerer Fahrzeit.']]},
     {label:'Text 3', plays:2, lines:[['Radio','Und jetzt ein Tipp für alle, die eine Ausbildung suchen: Am Samstag findet in der Stadthalle die große Ausbildungsmesse statt. Über 80 Betriebe aus der Region stellen sich vor, vom Krankenhaus bis zur Bäckerei. Der Eintritt ist frei. Bringen Sie am besten Ihren Lebenslauf mit, denn manche Firmen führen direkt vor Ort erste Gespräche.']]},
     {label:'Text 4', plays:2, lines:[['Ansage','Willkommen beim Bürgeramt. Leider sind im Moment alle Leitungen besetzt. Termine für die Anmeldung einer Wohnung oder einen neuen Personalausweis buchen Sie am schnellsten online auf unserer Internetseite. Für Fragen zum Führerschein drücken Sie bitte die Eins. Für alle anderen Fragen bleiben Sie bitte in der Leitung.']]},
     {label:'Text 5', plays:2, lines:[['Lukas','Hi Amira, Lukas hier. Wegen Samstag: Das Grillen im Park fällt leider ins Wasser, es soll den ganzen Tag regnen. Wir machen stattdessen einen Spieleabend bei mir. Bring doch bitte einen Salat mit, um die Getränke kümmere ich mich. Wir fangen um acht an. Sag mir bis Freitag Bescheid, ob du kommst!']]}],
   items:[I('Frau Yilmaz kann ihr Auto heute abholen.','RF',0,0,'„Sie können den Wagen heute bis 18 Uhr abholen.“'),
     I('Wenn Frau Yilmaz heute nicht kommt, kann sie das Auto … abholen.',['morgen ab 7 Uhr','am Montag ab 7 Uhr','heute nach 18 Uhr'],1,0,'„Morgen haben wir leider geschlossen, ab Montag … ab 7 Uhr“'),
     I('Am Wochenende fahren keine S-Bahnen zum Flughafen.','RF',0,1,'„fahren am Wochenende zwischen Hauptbahnhof und Flughafen keine Züge“'),
     I('Die Ersatzbusse fahren …',['alle 15 Minuten.','alle 20 Minuten.','nur am Samstag.'],0,1,'20 minutes is the extra travel time.'),
     I('Für die Ausbildungsmesse muss man Eintritt bezahlen.','RF',1,2,'„Der Eintritt ist frei.“'),
     I('Was sollen die Besucher mitbringen?',['ein Foto','ihren Lebenslauf','ihr Zeugnis'],1,2,'„Bringen Sie am besten Ihren Lebenslauf mit“'),
     I('Einen Termin für die Anmeldung bekommt man am schnellsten im Internet.','RF',0,3,'„buchen Sie am schnellsten online“'),
     I('Wer eine Frage zum Führerschein hat, soll …',['online einen Termin buchen.','in der Leitung bleiben.','die Eins drücken.'],2,3),
     I('Lukas feiert am Samstag im Park.','RF',1,4,'„fällt ins Wasser“ = is cancelled because of rain. They meet at his place.'),
     I('Was soll Amira mitbringen?',['Getränke','einen Salat','ein Spiel'],1,4,'„Bring doch bitte einen Salat mit“')]},
  {title:'Teil 2 · Begrüßung (1×)', instr:'Sie hören nun einen Text. Sie hören den Text einmal. Dazu lösen Sie fünf Aufgaben. Wählen Sie bei jeder Aufgabe die richtige Lösung.\nSie beginnen eine Ausbildung in einem Krankenhaus und hören die Begrüßung am ersten Tag.',
   audio:[{label:'Begrüßung', plays:1, lines:[['Herr Wolf',`Guten Morgen und herzlich willkommen im Klinikum Nordstadt! Ich bin Martin Wolf, der Leiter der Pflegeschule. Schön, dass Sie alle hier sind: Wir haben dieses Jahr 45 neue Auszubildende, so viele wie noch nie.
Zuerst ein paar wichtige Informationen. Ihre Ausbildung dauert drei Jahre. Sie sind abwechselnd ein paar Wochen in der Schule und ein paar Wochen auf den Stationen. Die ersten sechs Wochen haben Sie nur Unterricht. Erst danach gehen Sie zum ersten Mal auf eine Station.
Ihre Arbeitskleidung bekommen Sie heute Nachmittag im Keller, Raum 12. Bitte nehmen Sie Ihren Ausweis mit. Die Kleidung wird bei uns im Haus gewaschen, Sie müssen sie also nicht mit nach Hause nehmen.
Mittagessen gibt es in der Kantine im Erdgeschoss. Für Auszubildende kostet ein Essen nur 2 Euro 50.
Und noch etwas: Jeder von Ihnen bekommt einen Paten aus dem zweiten Ausbildungsjahr. Wenn Sie Fragen oder Probleme haben, ist er oder sie für Sie da. Ihre Paten lernen Sie gleich nach der Pause kennen. Jetzt gibt es aber erst einmal Kaffee!`]]}],
   items:[I('Herr Wolf ist …',['der Leiter der Pflegeschule.','Arzt im Klinikum.','Auszubildender im zweiten Jahr.'],0,0),
     I('In den ersten sechs Wochen …',['arbeiten die Auszubildenden auf einer Station.','haben die Auszubildenden Urlaub.','haben die Auszubildenden nur Unterricht.'],2,0,'„Die ersten sechs Wochen haben Sie nur Unterricht.“'),
     I('Die Arbeitskleidung …',['muss man selbst kaufen.','wird im Klinikum gewaschen.','muss man zu Hause waschen.'],1,0,'„Die Kleidung wird bei uns im Haus gewaschen“'),
     I('Ein Mittagessen für Auszubildende …',['kostet 2,50 Euro.','ist kostenlos.','gibt es im Keller.'],0,0,'The clothes are in the basement; the canteen is on the ground floor.'),
     I('Was passiert nach der Pause?',['Die Auszubildenden holen ihre Kleidung.','Die Auszubildenden gehen auf eine Station.','Die Auszubildenden lernen ihre Paten kennen.'],2,0,'„Ihre Paten lernen Sie gleich nach der Pause kennen.“')]},
  {title:'Teil 3 · Gespräch (1×)', instr:'Sie hören nun ein Gespräch. Sie hören das Gespräch einmal. Dazu lösen Sie sieben Aufgaben. Wählen Sie: Sind die Aussagen Richtig oder Falsch?\nSie sind im Baumarkt und hören, wie sich zwei Bekannte unterhalten.',
   audio:[{label:'Gespräch', plays:1, lines:[['Jana','Malik! Was machst du denn hier im Baumarkt?'],['Malik','Hallo Jana! Ich kaufe Farbe. Ich bin letzte Woche umgezogen und will jetzt das Schlafzimmer streichen.'],
     ['Jana','Umgezogen? Wohnst du nicht mehr in der WG?'],['Malik','Nein, ich habe endlich eine eigene Wohnung gefunden. Zwei Zimmer mit Balkon, direkt neben meiner Firma. Ich kann jetzt zu Fuß zur Arbeit gehen.'],
     ['Jana','Super! War die Suche schwierig?'],['Malik','Und wie! Ich habe fast ein halbes Jahr gesucht und war bei über zwanzig Besichtigungen. Am Ende hat mir ein Kollege geholfen: Seine Tante vermietet die Wohnung.'],
     ['Jana','Da hattest du Glück. Ist die Miete hoch?'],['Malik','Sie ist teurer als mein Zimmer in der WG, aber für die Lage ist sie okay. Und bei dir? Was gibt’s Neues?'],
     ['Jana','Ich habe morgen ein Vorstellungsgespräch bei einer Bank. Ich bin ziemlich nervös.'],['Malik','Das schaffst du! Hast du dich gut vorbereitet?'],
     ['Jana','Ich glaube schon. Ich habe mir die Internetseite genau angesehen und mit meiner Schwester geübt. Sie arbeitet in einer Personalabteilung.'],
     ['Malik','Perfekt. Und danach feiern wir! Komm doch am Samstag zu meiner Einweihungsparty.'],['Jana','Gerne! Soll ich etwas mitbringen?'],
     ['Malik','Nur gute Laune. Und vielleicht einen Pinsel, falls ich mit dem Streichen noch nicht fertig bin!']]}],
   items:[I('Malik ist vor einem Monat umgezogen.','RF',1,0,'„letzte Woche“'),I('Malik wohnt nicht mehr in einer WG.','RF',0,0,'„ich habe endlich eine eigene Wohnung gefunden“'),
     I('Malik fährt jetzt mit dem Bus zur Arbeit.','RF',1,0,'„Ich kann jetzt zu Fuß zur Arbeit gehen.“'),I('Malik hat die Wohnung mit Hilfe eines Kollegen gefunden.','RF',0,0,'The colleague’s aunt rents it out.'),
     I('Die neue Wohnung ist billiger als das Zimmer in der WG.','RF',1,0,'„Sie ist teurer als mein Zimmer in der WG“'),I('Jana hat morgen ein Vorstellungsgespräch.','RF',0,0),
     I('Janas Schwester hat ihr bei der Vorbereitung geholfen.','RF',0,0,'„mit meiner Schwester geübt“')]},
  {title:'Teil 4 · Diskussion (2×)', instr:'Sie hören nun eine Diskussion. Sie hören die Diskussion zweimal. Dazu lösen Sie acht Aufgaben. Ordnen Sie die Aussagen zu: Wer sagt was?\nDer Moderator der Radiosendung „Treffpunkt Gesellschaft“ diskutiert mit Frau Keller, Lehrerin, und Herrn Haddad, Freiwilliger in einem Altenheim, über ein Freiwilliges Soziales Jahr nach der Schule.',
   audio:[{label:'Diskussion', plays:2, lines:[['Moderator','Guten Abend und willkommen zu „Treffpunkt Gesellschaft“. Nach der Schule direkt studieren oder eine Ausbildung anfangen – oder erst einmal ein Freiwilliges Soziales Jahr machen? Darüber spreche ich mit Frau Keller, Lehrerin an einer Gesamtschule, und mit Herrn Haddad, der gerade sein Freiwilliges Jahr in einem Altenheim macht. Herr Haddad, warum haben Sie sich dafür entschieden?'],
     ['Herr Haddad','Ehrlich gesagt wusste ich nach dem Abitur nicht, was ich machen soll. Ich wollte nicht einfach irgendetwas studieren und nach einem Semester aufhören. Im Altenheim lerne ich jeden Tag etwas Neues, und ich merke, dass mir die Arbeit mit Menschen wirklich Spaß macht.'],
     ['Moderator','Frau Keller, empfehlen Sie Ihren Schülern so ein Jahr?'],
     ['Frau Keller','Vielen schon. Die meisten Jugendlichen sind nach der Schule achtzehn oder neunzehn. In diesem Alter kennen viele ihre Stärken noch nicht. Ein Jahr in der Praxis hilft, die richtige Entscheidung zu treffen.'],
     ['Moderator','Aber man verliert doch auch ein Jahr, oder?'],
     ['Frau Keller','Das höre ich oft von Eltern. Ich sehe das anders: Wer sich bewusst für einen Beruf entscheidet, bricht seine Ausbildung seltener ab. Am Ende spart man also eher Zeit.'],
     ['Herr Haddad','Und man bekommt ja auch etwas Geld. Nicht viel, aber ich kann davon mein Handy und meine Fahrkarte bezahlen.'],
     ['Moderator','Gibt es auch Nachteile?'],
     ['Herr Haddad','Die Arbeit ist manchmal hart, körperlich und auch emotional. Letzten Monat ist eine Bewohnerin gestorben, die ich sehr gern hatte. Das war schwer für mich.'],
