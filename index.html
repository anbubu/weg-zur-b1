const PLAN_ORDER = ['cards', 'lesson', 'book', 'rest', 'video', 'practice', 'reading', 'writing'];
// c: {due: words due today, lesson: next lesson or null, reading: {id,title,level} or null, writing: {id,title} or null, weak: has weak spots}
function planBlocks(size, c){
  const m = PLAN_MIN[size] || PLAN_MIN[120], res = c.lesson ? RES[c.lesson.id] : null, out = [];
  const make = {
    cards:    () => ({t:'app', act:'cards', title:'Flashcards', sub:`${Math.min(c.due, 15)} word${c.due === 1 ? '' : 's'} to review`}),
    lesson:   () => c.lesson ? {t:'app', act:'lesson', id:c.lesson.id, title:`Lesson: ${c.lesson.title}`, sub:c.lesson.sub}
                             : {t:'app', act:'practice', title:'Grammar training', sub:'Mixed questions on cases and verb forms'},
    book:     () => res && res.b.length ? {t:'book', title:'In your book', sub:'Read the pages and do the exercises. Tick it when you are done.', refs:res.b.slice(0, 3)}
                : c.lesson ? {t:'book', title:'Write it down', sub:'Read the lesson again and write 10 sentences of your own in a notebook.', refs:[]}
                : {t:'book', title:'In your book: B1 grammar', sub:'Grammatik Aktiv, units 49 to 80: one unit today, with its exercises.', refs:[['ga', '49', 'Präteritum (the B1 units start here)', 116]]},
    rest:     () => ({t:'rest', title:'Break', sub:'Stand up, drink some water, rest your eyes.'}),
    video:    () => res ? {t:'video', title:'Watch', sub:'Pause often and repeat what you hear. Tick it when you are done.', video:res.v[0]}
                        : {t:'video', title:'Watch and listen', sub:'Pick a Nicos Weg episode or an Easy German video on a topic you like. Pause and repeat.', video:null},
    practice: () => ({t:'app', act:'practice', title:c.weak ? 'Practise your weak spots' : 'Mixed practice', sub:'Questions mixed from everything you have learned'}),
    reading:  () => c.reading ? {t:'app', act:'reading', id:c.reading.id, title:`Read: ${c.reading.title}`, sub:`${c.reading.level} · answer the questions, then listen to the text`}
                              : {t:'app', act:'goto', id:'pruefung', title:'Practice exam: Lesen', sub:'Open Prüfung and do one part'},
    writing:  () => c.writing ? {t:'app', act:'writing', id:c.writing.id, title:`Write: ${c.writing.title}`, sub:'Write first, then check your text'}
                              : {t:'app', act:'goto', id:'schreiben', title:'Writing', sub:'Pick a task in Schreiben'},
  };
  for (const key of PLAN_ORDER){
    if (!m[key] || (key === 'cards' && !c.due)) continue;
    // with nothing to review, the flashcard minutes go to practice
    out.push(Object.assign({key, min: m[key] + (key === 'practice' && !c.due ? m.cards : 0)}, make[key]()));
  }

}

function buildSearchIndex(extra){
  const docs = [], add = d => { d.ft = fold(d.title); d.words = ' ' + fold(d.title + ' ' + (d.sub || '') + ' ' + (d.text || '')).replace(/[^a-z0-9]+/g, ' '); docs.push(d); };
  for (const l of LESSONS){

    l.ex.forEach(([de, en]) => add({type:'example', title:de, sub:en, id:l.id}));
    for (const [b, ch, sec, p] of (RES[l.id] || {b:[]}).b) add({type:'book', title:`${BOOKS[b].name} · ${BOOKS[b].ch} ${ch}`, sub:`${sec} · p. ${p} (PDF ${p + BOOKS[b].pdf})`, text:l.title, id:l.id});
    for (const [vid, title, ch] of (RES[l.id] || {v:[]}).v) add({type:'video', title, sub:ch, text:l.title, vid, id:l.id});
  }
  for (const v of VOCAB) add({type:'word', id:v.id, title:(G[v.g] ? G[v.g] + ' ' : '') + v.de, sub:v.en, say:v.de});
  for (const r of LIBRARY) for (const t of r.texts) for (const sent of plainText(t.body).split(/(?<=[.!?])\s+/)) if (sent.length > 25) add({type:'sentence', title:sent, sub:`${r.title} (${r.level})`, id:r.id});
  for (const d of (extra || [])) add(Object.assign({}, d));

}
const SEARCH_ORDER = [['lesson', 4], ['table', 4], ['word', 8], ['example', 6], ['sentence', 6], ['book', 5], ['video', 4]];
function searchIndex(docs, q){
  const toks = fold(q).split(/[^a-z0-9]+/).filter(Boolean);   // same word splitting as the stored text, so N-Deklination matches
  if (!toks.length || fold(q).trim().length < 2) return [];
  const tw = d => ' ' + d.ft.replace(/[^a-z0-9]+/g, ' ');
  const score = d => toks.reduce((a, t) => a + (d.ft.startsWith(t) ? 4 : tw(d).includes(' ' + t) ? 3 : d.ft.includes(t) ? 2 : 1), 0);
  // a word matches inside a title anywhere, but in the longer text only at the start of a word
  const hits = docs.filter(d => toks.every(t => d.ft.includes(t) || d.words.includes(' ' + t))).map((d, i) => ({d, i, s:score(d)}));
  return SEARCH_ORDER.map(([type, max]) => ({type, items:hits.filter(h => h.d.type === type).sort((a, b) => b.s - a.s || a.i - b.i).slice(0, max).map(h => h.d)})).filter(g => g.items.length);
}

    'Ich spreche ___ Französisch.|fließend|fließt;geflossen|fließend = fluent(ly).|I speak fluent French.',
    'Ich arbeite gern ___ Menschen.|mit|bei;für|mit + Dativ: mit Menschen arbeiten.|I like working with people.',
    'Ich interessiere mich sehr ___ diese Stelle.|für|an;auf|sich interessieren für + Akkusativ.|I am very interested in this position.',
    'Über eine Einladung zu einem Vorstellungsgespräch ___ ich mich sehr freuen.|würde|werde;wurde|Konjunktiv II würde + infinitive: the polite standard ending of an Anschreiben.|I would be very happy to be invited to an interview.',
    'Mit freundlichen ___|Grüßen|Grüße;Gruß|mit + Dativ plural: mit freundlichen Grüßen.|Kind regards',
    'Sehr ___ Damen und Herren,|geehrte|geehrter;geehrten|Sehr geehrte Damen und Herren: plural, ending -e.|Dear Sir or Madam,',

    'Im ___ finden Sie meinen Lebenslauf.|Anhang|Anfang;Anschluss|der Anhang = attachment.|Please find my CV attached.',
    'Ich kann ___ 1. März anfangen.|ab dem|seit dem;bis zum|ab = from (a point in the future): ab dem 1. März.|I can start from 1 March.',
    'Ich ___ zwei Jahre Erfahrung im Verkauf.|habe|bin;mache|Erfahrung haben = to have experience.|I have two years of experience in sales.'],
  interview:[
    'Erzählen Sie doch mal etwas über ___.|sich|Sie;ihr|Reflexive in the Sie form: über sich.|Tell us something about yourself.',
    'Warum ___ Sie bei uns arbeiten?|möchten|möchte;möchtest|Sie → möchten.|Why would you like to work for us?',
    'Meine Stärke ist, dass ich sehr geduldig ___.|bin|ist;sein|dass-clause: the verb goes to the end.|My strength is that I am very patient.',
    'Ich bleibe ruhig, auch wenn ein Kunde unfreundlich ___.|ist|sein;bin|wenn-clause: the verb goes to the end.|I stay calm even when a customer is rude.',
    'Ich habe drei Jahre ___ Kundenberater gearbeitet.|als|wie;für|als = as (a role or job).|I worked as a customer adviser for three years.',
    'Ich arbeite gern ___ Team.|im|in;am|im Team (in + dem).|I like working in a team.',
    'Seit wann ___ Sie in Deutschland?|sind|haben;ist|seit + present tense: Seit wann sind Sie …?|How long have you been in Germany?',
    'Wie sieht die Einarbeitung ___?|aus|an;vor|aussehen is separable: Wie sieht … aus?|What does the induction look like?',
    'Ich stelle ___ ein Gehalt von 2.400 Euro brutto vor.|mir|mich;ihm|sich (Dativ) etwas vorstellen: ich stelle mir … vor.|I’m thinking of a salary of 2,400 euros gross.',
    'Ich ___ sofort anfangen.|könnte|konnte;könnten|Konjunktiv II könnte sounds polite and flexible.|I could start straight away.',
    'Danke für die Einladung ___ Gespräch.|zum|zur;beim|zu + dem = zum (das Gespräch).|Thank you for the invitation to the interview.',
    'Ich freue mich ___ Ihre Antwort.|auf|über;für|sich freuen auf = to look forward to.|I look forward to your answer.',
    'Können Sie die Frage bitte ___?|wiederholen|wiederholt;wiederholte|Modal verb können + infinitive at the end.|Could you repeat the question, please?'],
};

LESSONS.push(
  vocabLesson('cc-telefon','Am Telefon','Calling, holding, transferring','cctelefon',
   `<p>The words of every phone call: calling, holding, transferring and calling back. In a call centre you will use them hundreds of times a day.</p><p class="tip">Many phone verbs are separable: <i>zurückrufen → Ich rufe Sie morgen zurück. weiterleiten → Ich leite Ihre Anfrage weiter.</i> On the phone you end with <i>Auf Wiederhören</i>, not <i>Auf Wiedersehen</i>.</p>`,
   [['Die Leitung ist leider besetzt.','Unfortunately the line is busy.'],['Ich verbinde Sie mit der Fachabteilung.','I’ll put you through to the specialist department.'],['Könnten Sie Ihren Namen bitte buchstabieren?','Could you spell your name, please?']], 'B1'),
  {id:'cc-saetze', level:'B1', kind:'Wortschatz', title:'Sätze für jedes Gespräch', sub:'Phrases from hello to goodbye', th:'ccsaetze',
   intro:`<p>A call centre call has a fixed shape: greet, find out the concern (<i>das Anliegen</i>), check who is calling, solve the problem or pass it on, sum up, say goodbye. These phrases cover every step. Learn them as whole sentences.</p>
<p class="tip">On the phone, polite means <b>Konjunktiv II</b>: <i>Könnten Sie …? Würden Sie …? Ich hätte noch eine Frage.</i> It sounds softer than <i>Können Sie …?</i>, and customers notice.</p>`,
   ex:[['Guten Tag, Sie sprechen mit Karim Benali. Was kann ich für Sie tun?','Good day, you’re speaking with Karim Benali. What can I do for you?'],['Habe ich Sie richtig verstanden, dass die Rechnung zu hoch ist?','Have I understood you correctly that the bill is too high?'],['Vielen Dank für Ihren Anruf. Auf Wiederhören!','Thank you for your call. Goodbye!']],
   drills:[['meaning',5,{th:'ccsaetze'}],['bank',7,{bank:'telefon'}]]},
  vocabLesson('cc-kunde','Kundendaten & Vertrag','Finding the customer, changing data, contracts','cckunde',
   `<p>Before you can help, you find the customer in the system and check who is calling. Then you often change their data or talk about the contract.</p><p class="tip">Numbers on the phone: say them one by one or in pairs, and say <i>zwo</i> instead of <i>zwei</i> so it is not confused with <i>drei</i>. For spelling, many people still use the classic alphabet <i>A wie Anton, B wie Berta, C wie Cäsar</i>; the new official one uses cities: <i>A wie Aachen, B wie Berlin</i>.</p>`,
   [['Wie lautet Ihre Kundennummer?','What is your customer number?'],['Ich habe Ihre neue Anschrift gespeichert.','I have saved your new address.'],['Der Vertrag hat eine Mindestlaufzeit von 24 Monaten.','The contract has a minimum term of 24 months.']], 'B1'),
  vocabLesson('cc-rechnung','Rechnung & Zahlung','Bills, payments and refunds','ccrechnung',
   `<p>Many calls are about money: a bill that seems too high, a missing payment, a refund. These words help you explain a bill calmly.</p><p class="tip">Two words customers mix up: a <i>Gutschrift</i> is money credited to the account, for example on the next bill; a <i>Rückerstattung</i> is money paid back to the bank account. A <i>Mahnung</i> comes when a bill was not paid by the <i>Frist</i>.</p>`,
   [['Der Betrag wird am Monatsanfang abgebucht.','The amount is debited at the start of the month.'],['Sie bekommen eine Gutschrift auf der nächsten Rechnung.','You’ll get a credit on your next bill.'],['Die Rechnung ist am 15. fällig.','The bill is due on the 15th.']], 'B1'),
  vocabLesson('cc-beschwerde','Beschwerden & Lieferung','Complaints, deliveries and returns','ccbeschwerde',
   `<p>Angry customers are part of the job. The words for complaints, deliveries and returns help you understand the problem quickly, and the right phrases calm the call down.</p><p class="tip">A good pattern for complaints: <b>listen, apologise, act</b>. <i>Ich verstehe Ihren Ärger. Das tut mir leid. Ich kümmere mich sofort darum.</i> Never say it is the customer’s fault.</p>`,
   [['Das Paket ist leider beschädigt angekommen.','Unfortunately the parcel arrived damaged.'],['Sie können die Ware innerhalb von 14 Tagen zurückschicken.','You can send the goods back within 14 days.'],['Wir schicken Ihnen kostenlos einen Ersatz.','We’ll send you a replacement free of charge.']], 'B1'),
  vocabLesson('cc-technik','Technischer Support','Routers, passwords and error messages','cctechnik',
   `<p>In technical support you guide the customer step by step: unplug, restart, check the lights. Short, clear instructions in the <i>Sie</i> form are what you need.</p><p class="tip">Instructions use the polite imperative, verb first: <i>Schalten Sie den Router bitte aus. Warten Sie 30 Sekunden. Stecken Sie das Kabel wieder ein.</i> Then check: <i>Was sehen Sie jetzt? Blinkt die Lampe noch?</i></p>`,
   [['Starten Sie den Router bitte neu.','Please restart the router.'],['Welche Fehlermeldung sehen Sie?','Which error message do you see?'],['Ich setze Ihr Passwort zurück.','I’ll reset your password.']], 'B1'),
  vocabLesson('cc-alltag','Arbeiten im Call-Center','Shifts, team and targets','ccjob',
   `<p>The words of the job itself: your shifts, your team, your training, and the numbers your work is measured by.</p><p class="tip">Call centres use English words with German articles: <i>das Ticket, das Feedback, der Inbound</i> (customers call you), <i>der Outbound</i> (you call customers). Inbound jobs are usually easier to start with.</p>`,
   [['Nächste Woche habe ich Spätschicht.','Next week I’m on the late shift.'],['Die Einarbeitung dauert vier Wochen.','The induction lasts four weeks.'],['Jedes Gespräch wird im System dokumentiert.','Every call is documented in the system.']], 'B1'),
  {id:'job-bewerbung', level:'B1', kind:'Beruf', title:'Anschreiben & Lebenslauf', sub:'Writing your application',
   intro:`<p>For a job in Germany you send an <b>Anschreiben</b> (cover letter, one page) and a <b>Lebenslauf</b> (CV, set out as a table), usually as one PDF by e-mail or through an online form.</p>
<h4>The Anschreiben in five parts</h4>
<ol><li><b>Betreff:</b> <i>Bewerbung als Kundenberater (m/w/d)</i></li>
<li><b>Anrede:</b> <i>Sehr geehrte Frau Wagner,</i> or, if you don’t know the name, <i>Sehr geehrte Damen und Herren,</i></li>
<li><b>Why this job:</b> <i>Hiermit bewerbe ich mich um … Ihre Anzeige hat mich sehr interessiert, weil …</i></li>
<li><b>What you bring:</b> <i>Ich habe … Jahre als … gearbeitet. Ich spreche Arabisch als Muttersprache, Französisch fließend und Deutsch auf dem Niveau B1.</i></li>
<li><b>End:</b> <i>Ich kann ab dem … anfangen. Über eine Einladung zu einem Vorstellungsgespräch würde ich mich sehr freuen. Mit freundlichen Grüßen</i> and your name.</li></ol>
<h4>The Lebenslauf</h4><p>A table, newest entry first: <i>Persönliche Daten</i> (name, address, phone, e-mail), <i>Berufserfahrung</i>, <i>Schulbildung</i> or <i>Ausbildung</i>, <i>Sprachkenntnisse</i>, <i>EDV-Kenntnisse</i> (computer skills), and hobbies if you like. A photo is optional.</p>
<p class="tip">Write your languages the German way: <i>Arabisch: Muttersprache · Französisch: fließend · Deutsch: B1 (Goethe-Zertifikat) · Englisch: gute Kenntnisse</i>. For a call centre your languages are a real advantage. Practise the whole letter in Schreiben: “Bewerbung als Kundenberater”.</p>`,
   ex:[['Hiermit bewerbe ich mich um die Stelle als Kundenberater.','I hereby apply for the position of customer adviser.'],['Ich spreche Arabisch als Muttersprache und Französisch fließend.','Arabic is my native language and I speak French fluently.'],['Über eine Einladung zu einem Vorstellungsgespräch würde ich mich sehr freuen.','I would be very happy to be invited to an interview.']],
   drills:[['bank',8,{bank:'bewerbung'}],['meaning',4,{th:'bewerbung'}]]},
  {id:'job-interview', level:'B1', kind:'Beruf', title:'Das Vorstellungsgespräch', sub:'Questions and good answers',
   intro:`<p>A German job interview usually follows the same steps: small talk, you introduce yourself, questions about your experience and strengths, the company explains the job, and at the end <b>your</b> questions. You always say <i>Sie</i>.</p>
<h4>The questions you will hear</h4>
<div class="tablewrap"><table class="ct"><tr><th>Question</th><th>A good answer starts with</th></tr>
<tr><td>Erzählen Sie etwas über sich.</td><td>Ich heiße …, ich komme aus … und lebe seit … in Deutschland. Ich habe … als … gearbeitet.</td></tr>
<tr><td>Warum möchten Sie bei uns arbeiten?</td><td>Ich arbeite gern mit Menschen, und Ihre Firma …</td></tr>
<tr><td>Was sind Ihre Stärken?</td><td>Ich bin geduldig und bleibe ruhig, auch wenn …</td></tr>
<tr><td>Was sind Ihre Schwächen?</td><td>Manchmal bin ich zu … Aber ich arbeite daran: …</td></tr>
<tr><td>Was machen Sie, wenn ein Kunde wütend ist?</td><td>Ich höre zu, entschuldige mich und suche eine Lösung.</td></tr>
<tr><td>Können Sie im Schichtdienst arbeiten?</td><td>Ja, das ist für mich kein Problem.</td></tr>
<tr><td>Was sind Ihre Gehaltsvorstellungen?</td><td>Ich stelle mir … Euro brutto im Monat vor.</td></tr>
<tr><td>Ab wann können Sie anfangen?</td><td>Ab dem … / Ab sofort.</td></tr></table></div>
<h4>Your questions at the end</h4><p>Always ask one or two: <i>Wie sieht die Einarbeitung aus? Wie sind die Arbeitszeiten? Wann bekomme ich eine Antwort?</i></p>
<p class="tip">If you don’t understand a question, ask: <i>Können Sie die Frage bitte wiederholen?</i> That is exactly the skill a call centre needs, so it never looks bad. Say clearly which languages you speak and how well.</p>`,
   ex:[['Ich habe zwei Jahre im Kundenservice gearbeitet.','I worked in customer service for two years.'],['Meine Stärke ist, dass ich auch in stressigen Situationen ruhig bleibe.','My strength is that I stay calm even in stressful situations.'],['Wie sieht die Einarbeitung aus?','What does the induction look like?']],
   drills:[['bank',10,{bank:'interview'}]]});

// ---- Telefon-Training: role-play calls. The app speaks the other person, you answer out loud. ----
// keys: what a good answer must contain. "a/b" = either one; each one matches at the start of a word, so stems like "entschuldig" work.
const callNorm = s => ' ' + fold(s).replace(/[^\p{L}\p{N}€%]+/gu, ' ').trim() + ' ';
function phoneCheck(said, keys){
  const t = callNorm(said), hit = keys.filter(k => k.split('/').some(a => t.includes(callNorm(a).slice(0, -1))));
  return {hit, miss:keys.filter(k => !hit.includes(k)), score:keys.length ? hit.length / keys.length : 0};
}

  {id:'c-rechnung', title:'Die Rechnung ist zu hoch', who:'Frau Schulz', where:'MobilFon Kundenservice', lesson:'cc-rechnung', steps:[

     task:'Show that you understand her, say you will check, and ask for her phone number.', model:'Ich verstehe, dass Sie sich ärgern, Frau Schulz. Ich schaue sofort nach. Wie ist Ihre Rufnummer, bitte?', keys:['verstehe','schaue/prüfe/nachsehen/kümmere','rufnummer/telefonnummer/handynummer/kundennummer']},
    {c:'Meine Nummer ist 0151 2 4 6 8 0 9 3.', en:'My number is 0151 2 4 6 8 0 9 3.',

     task:'Explain: in May she made calls in Turkey. Turkey is not in the EU, so the calls cost 29.90 euros extra.', model:'Danke, Frau Schulz. Ich sehe hier, dass Sie im Mai in der Türkei telefoniert haben. Die Türkei ist nicht in der EU, deshalb haben diese Anrufe 29,90 Euro extra gekostet.', keys:['türkei','eu','telefoniert/anrufe/gespräche','gekostet/kosten/euro/€']},
    {c:'Ach, der Urlaub! Das wusste ich nicht. Kann ich das in Raten bezahlen?', en:'Oh, the holiday! I didn’t know that. Can I pay it in instalments?',
     task:'Say yes: she can pay in three instalments. The first one is debited on the 1st of next month.', model:'Ja, das ist kein Problem. Sie können den Betrag in drei Raten bezahlen. Die erste Rate wird am Ersten des nächsten Monats abgebucht.', keys:['rate','drei/3','abgebucht/abbuch/abgezogen']},
    {c:'Super, vielen Dank!', en:'Great, thank you very much!',
     task:'Say she will get a confirmation by e-mail, then end the call politely.', model:'Gern geschehen. Sie bekommen gleich eine Bestätigung per E-Mail. Vielen Dank für Ihren Anruf und auf Wiederhören!', keys:['bestätigung','mail', ...BYE]}]},
  {id:'c-paket', title:'Das Paket ist nicht da', who:'Herr Wolff', where:'ModeMarkt Online-Shop', lesson:'cc-beschwerde', steps:[

    {c:'Ich habe vor zwei Wochen eine Jacke bestellt, und sie ist immer noch nicht da! Ich habe schon dreimal angerufen!', en:'I ordered a jacket two weeks ago and it’s still not here! I’ve already called three times!',
     task:'Apologise, say you understand his anger, and ask for the order number.', model:'Das tut mir wirklich leid. Ich verstehe Ihren Ärger. Können Sie mir bitte Ihre Bestellnummer nennen?', keys:['tut mir leid/leid/entschuldig','verstehe','bestellnummer/auftragsnummer']},
    {c:'Die Bestellnummer ist M K 4 4 7 1.', en:'The order number is M K 4 4 7 1.',
     task:'Say you are checking. Then explain: the parcel came back to you because the house number was missing.', model:'Einen Moment, ich schaue nach. … Das Paket ist leider zu uns zurückgekommen, weil die Hausnummer gefehlt hat.', keys:['moment/schaue','zurück','hausnummer']},
    {c:'Oh nein. Die Hausnummer ist siebzehn.', en:'Oh no. The house number is seventeen.',
     task:'Repeat the address to check it: Lindenstraße 17 in Köln. Ask if that is right.', model:'Ich wiederhole: Lindenstraße 17 in Köln. Ist das richtig?', keys:['lindenstraße','17/siebzehn','köln','richtig/stimmt']},
    {c:'Ja, genau.', en:'Yes, exactly.',

    {c:'Na gut. Danke schön.', en:'Well, all right. Thank you.',
     task:'As an apology, give him a 10 % voucher. Then say goodbye.', model:'Als Entschuldigung bekommen Sie außerdem einen Gutschein über zehn Prozent. Vielen Dank für Ihren Anruf. Auf Wiederhören!', keys:['entschuldigung','gutschein/rabatt','prozent/%', 'wiederhören']}]},
  {id:'c-adresse', title:'Eine neue Adresse', who:'Frau Yilmaz', where:'VitaVersicherung Service', lesson:'cc-kunde', steps:[
    GREET('VitaVersicherung'),

    {c:'V wie Viktor, 7 7 0 3 5.', en:'V as in Viktor, 7 7 0 3 5.',
     task:'Ask for her new address: street, house number, postcode and town.', model:'Danke. Wie lautet Ihre neue Anschrift? Ich brauche die Straße, die Hausnummer, die Postleitzahl und den Ort.', keys:['anschrift/adresse','straße','hausnummer','postleitzahl']},
    {c:'Ahornweg 5, 80331 München.', en:'Ahornweg 5, 80331 Munich.',

  {id:'c-kuendigung', title:'Ich will kündigen', who:'Frau Klein', where:'MobilFon Kundenservice', lesson:'cc-kunde', steps:[
    GREET('MobilFon'),

     task:'Offer the plan “Smart S”: 9.99 euros a month with 10 gigabytes.', model:'Doch, ich kann Ihnen unseren Tarif Smart S anbieten. Er kostet nur 9,99 Euro im Monat, und Sie haben zehn Gigabyte.', keys:['tarif','9/neun','monat','gigabyte/gb']},
    {c:'Das klingt gut. Dann nehme ich lieber den.', en:'That sounds good. Then I’d rather take that one.',
     task:'Confirm: the new plan starts next month, and she gets the contract documents by e-mail.', model:'Sehr gern. Der neue Tarif gilt ab dem nächsten Monat. Die Vertragsunterlagen bekommen Sie per E-Mail.', keys:['tarif','nächsten monat','mail']},
    {c:'Danke, tschüss!', en:'Thanks, bye!',
     task:'End the call the phone way and wish her a nice day.', model:'Vielen Dank für Ihren Anruf. Ich wünsche Ihnen einen schönen Tag. Auf Wiederhören!', keys:['schönen tag', ...BYE]}]},
  {id:'c-interview', title:'Das Vorstellungsgespräch', who:'Frau Wagner', where:'TeleServ, Personalabteilung', lesson:'job-interview', face:1, steps:[
    {c:'Guten Tag! Schön, dass Sie da sind. Haben Sie gut zu uns gefunden?', en:'Hello! Nice that you’re here. Did you find us easily?',
     task:'Small talk: say yes, it was easy, and thank her for the invitation.', model:'Ja, danke, das war kein Problem. Vielen Dank für die Einladung.', keys:['danke/dank','einladung']},
    {c:'Erzählen Sie doch mal etwas über sich.', en:'Tell me something about yourself.',
     task:'Introduce yourself: your name, where you are from, how long you have been in Germany, and your work experience.', model:'Gern. Ich heiße Karim Benali und komme aus Casablanca in Marokko. Ich lebe seit einem Jahr in Deutschland. In Marokko habe ich zwei Jahre im Kundenservice gearbeitet.', keys:['ich heiße/mein name/ich bin','komme aus','seit','gearbeitet/arbeite']},
    {c:'Warum möchten Sie gerade bei uns im Kundenservice arbeiten?', en:'Why do you want to work in our customer service in particular?',
     task:'Say you like working with people and solving problems, and that your languages help the customers.', model:'Ich arbeite gern mit Menschen, und ich löse gern Probleme. Außerdem spreche ich Arabisch, Französisch und Deutsch. Das ist für Ihre Kunden ein Vorteil.', keys:['menschen','problem/löse/helfe','spreche','arabisch/französisch/sprachen']},
    {c:'Was machen Sie, wenn ein Kunde am Telefon sehr wütend ist?', en:'What do you do when a customer is very angry on the phone?',
     task:'Say you stay calm and listen, then you apologise and look for a solution.', model:'Ich bleibe ruhig und höre gut zu. Dann entschuldige ich mich und suche eine Lösung für den Kunden.', keys:['ruhig','höre/zuhören','entschuldig/tut mir leid/leid','lösung']},
    {c:'Können Sie auch im Schichtdienst und am Wochenende arbeiten?', en:'Can you also work shifts and at weekends?',
     task:'Say yes, that is no problem for you; you are flexible.', model:'Ja, das ist für mich kein Problem. Ich bin flexibel.', keys:['ja','kein problem/flexibel/gern']},
    {c:'Gut. Haben Sie noch Fragen an uns?', en:'Good. Do you have any questions for us?',
     task:'Ask about the induction and the working hours.', model:'Ja, gern. Wie sieht die Einarbeitung aus? Und wie sind die Arbeitszeiten?', keys:['einarbeitung','arbeitszeit/schicht']},
    {c:'Die Einarbeitung dauert vier Wochen, und wir arbeiten zwischen sieben und zweiundzwanzig Uhr. Wir melden uns nächste Woche bei Ihnen.', en:'The induction takes four weeks, and we work between 7 am and 10 pm. We’ll get back to you next week.',
     task:'Thank her for the conversation, say you look forward to her answer, and say goodbye. You are face to face, so: Auf Wiedersehen.', model:'Vielen Dank für das Gespräch. Ich freue mich auf Ihre Antwort. Auf Wiedersehen!', keys:['danke/dank','gespräch','freue','wiedersehen']}]},
];

// Progress travels between devices as a text code: "WZB1." + base64 of the saved state as UTF-8 JSON.
const CODE_PREFIX = 'WZB1.', BAD_CODE = 'The code is incomplete or damaged. Copy it again, all of it, and paste it here.';
function progressCode(s){
  const bytes = new TextEncoder().encode(JSON.stringify(s));
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return CODE_PREFIX + btoa(bin);
}
function readProgressCode(code){
  const c = String(code || '').replace(/\s+/g, '');
  if (!c.startsWith(CODE_PREFIX)) throw new Error('This isn’t a Weg zur B1 progress code. A code starts with WZB1.');
  let s;
  try { const bin = atob(c.slice(CODE_PREFIX.length)); s = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, ch => ch.charCodeAt(0)))); }
  catch(e){ throw new Error(BAD_CODE); }
  if (!s || s.v !== 1 || typeof s.xp !== 'number' || !s.days || typeof s.days !== 'object') throw new Error(BAD_CODE);
  return s;
}
const progressSummary = s => ({xp:s.xp || 0, lessons:Object.keys(s.done || {}).filter(k => s.done[k]).length, days:Object.keys(s.met || {}).filter(k => s.met[k]).length, at:s.updatedAt || 0});

// When a new version has been installed in the background, reload at the next quiet moment (never in the middle of a lesson or exam).

let rendered = false;
function render(){
  if (maybeReload()) return;

document.addEventListener('click', e => { const b = e.target.closest('[data-goto]'); if (b){ stopActivity(); view = b.dataset.goto; render(); toTop(); } });

const nextLesson = () => LESSONS.find(l => !state.done[l.id] && !(l.primer && Object.values(state.done).some(Boolean)));
const dueCards = () => Object.keys(state.cards).filter(id => VBYID[id] && state.cards[id].d <= today());
function grammarPool(){
  const upto = LESSONS.indexOf(nextLesson()), last = upto === -1 ? LESSONS.length - 1 : upto;
  return LESSONS.filter((l, i) => i <= last || state.done[l.id]).flatMap(l => l.drills).filter(d => !['meaning','gender'].includes(d[0]));
}
// Pick exercises weighted by how often you get that type wrong. focus = weak spots only.
function mixedDrill(n = 10, focus = false){
  const seen = LESSONS.flatMap(l => l.drills).filter(d => !['meaning','gender'].includes(d[0]) && (state.stats[kindKey(d[0], d[2])] || {n:0}).n >= 3);
  const pool = focus && seen.length ? seen : grammarPool(), w = pool.map(d => { const e = errRate(state.stats[kindKey(d[0], d[2])]); return focus ? e * e * 4 + .05 : .4 + e * 2; });
  const total = w.reduce((a, b) => a + b, 0);
  const pick = () => { let r = Math.random() * total; for (let i = 0; i < pool.length; i++){ r -= w[i]; if (r <= 0) return pool[i]; } return pool[pool.length - 1]; };
  return buildQuiz(Array.from({length:n}, () => { const d = pick(); return [d[0], 1, d[2]]; }));
}
function weakSpots(){
  return Object.entries(state.stats).filter(([k, s]) => s.n >= 5 && KIND_NAME[k] && k !== 'meaning:')
    .map(([k, s]) => ({k, name:KIND_NAME[k], pct:Math.round(s.c / s.n * 100), e:errRate(s)})).sort((a, b) => b.e - a.e);
}
function completeLesson(l){
  const first = !state.done[l.id];
  state.done[l.id] = true;
  if (l.th) for (const v of VOCAB) if (v.th === l.th && !state.cards[v.id]) state.cards[v.id] = {b:0, d:today()};
  if (first) addXP(20);
  save();
  return first;
}

// ---- views ----
let calOffset = 0;
function gaugeSvg(frac, hot){
  const N = 12, R = 92, cx = 110, cy = 112, gap = 4, on = Math.round(Math.min(1, frac) * N);
  let p = '';
  for (let i = 0; i < N; i++){
    const a0 = Math.PI + (i * 180 / N + gap / 2) * Math.PI / 180, a1 = Math.PI + ((i + 1) * 180 / N - gap / 2) * Math.PI / 180;
    p += `<path class="seg${i < on ? ' on' : ''}${i < on && hot ? ' hot' : ''}" style="--i:${i}" d="M${(cx + R * Math.cos(a0)).toFixed(1)} ${(cy + R * Math.sin(a0)).toFixed(1)} A${R} ${R} 0 0 1 ${(cx + R * Math.cos(a1)).toFixed(1)} ${(cy + R * Math.sin(a1)).toFixed(1)}"/>`;
  }
  return `<svg viewBox="0 0 220 122" role="img" aria-label="${Math.round(Math.min(1, frac) * 100)}% of today’s goal">${p}</svg>`;
}
function ringsSvg(vals){
  const rs = [70, 53, 36];
  return `<svg viewBox="0 0 170 170" role="img" aria-label="${vals.map(v => `${v.label} ${v.pct}%`).join(', ')}">${vals.map((v, i) => {
    const r = rs[i], c = 2 * Math.PI * r, len = c * v.pct / 100;
    return `<circle class="trk" cx="85" cy="85" r="${r}"/>` + (v.pct ? `<circle class="val" cx="85" cy="85" r="${r}" stroke="${v.color}" style="--len:${len.toFixed(1)}" stroke-dasharray="${len.toFixed(1)} ${c.toFixed(1)}" stroke-dashoffset="0" transform="rotate(-90 85 85)"/>` : '');
  }).join('')}</svg>`;
}
function calHtml(){
  const now = new Date(), base = new Date(now.getFullYear(), now.getMonth() + calOffset, 1), y = base.getFullYear(), mo = base.getMonth();
  const first = (base.getDay() + 6) % 7, days = new Date(y, mo + 1, 0).getDate(), t = today(), fr = streakInfo(state.met, t).frozen;
  let cells = ['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => `<span>${d}</span>`).join('');
  for (let i = 0; i < first; i++) cells += '<i class="out"></i>';
  for (let d = 1; d <= days; d++){
    const k = dayKey(new Date(y, mo, d));
    cells += `<i class="${k === t ? 'today' : state.met[k] ? 'met' : fr[k] ? 'frz' : state.days[k] ? 'part' : ''}" title="${k}${state.days[k] ? ` · ${state.days[k]} XP` : ''}">${d}</i>`;
  }
  return {label:`${MONTHS[mo]} ${y}`, cells};
}
// The day's blocks are fixed when the day's plan is first built, so finishing the lesson doesn't change the rest of the plan.
function getPlan(){
  const t = today();
  if (!state.plan || state.plan.d !== t || state.plan.size !== state.planMin){
    const nl = nextLesson(), lvl = LV[(nl || {level:'B1'}).level];
    state.plan = {d:t, size:state.planMin, done:state.plan && state.plan.d === t ? state.plan.done : {},
      blocks:planBlocks(state.planMin, {due:dueCards().length, lesson:nl, reading:nextReading(), writing:WRITING.find(w => !w.speak && !state.writing[w.id] && LV[w.level] <= lvl), weak:weakSpots().length > 0})};
    save();
  }
  return state.plan;
}
function tickBlock(key, on){
  const pl = state.plan;
  if (on) pl.done[key] = true; else delete pl.done[key];
  state.credit[pl.d] = pl.blocks.filter(b => pl.done[b.key] && (b.t === 'book' || b.t === 'video')).reduce((a, b) => a + b.min, 0);
  checkGoal(); save(); chips();
}
function runBlock(b){
  const back = () => { stopActivity(); view = 'heute'; render(); toTop(); };
  const finish = () => { tickBlock(b.key, true); back(); };
  if (b.act === 'cards') runCards(shuffle(dueCards()).slice(0, 15), {onDone:finish});
  else if (b.act === 'lesson') openLesson(LESSONS.find(l => l.id === b.id), finish);
  else if (b.act === 'practice') runQuiz(mixedDrill(Math.max(10, b.min * 2), weakSpots().length > 0), {title:b.title, onDone:finish});
  else if (b.act === 'reading'){ const r = LIBRARY.find(x => x.id === b.id); startReading(r, r.id, finish); }
  else if (b.act === 'writing') openWriting(WRITING.find(w => w.id === b.id), 'heute', () => tickBlock(b.key, true));
  else if (b.act === 'goto'){ view = b.id; render(); toTop(); }
}

function startSession(){
  const steps = [];
  const due = shuffle(dueCards()).slice(0, 15);
  if (due.length) steps.push(done => runCards(due, {onDone: done}));
  const nl = nextLesson();
  steps.push(nl ? done => openLesson(nl, done) : done => runQuiz(mixedDrill(), {title:'Fall-Training', onDone: done}));
  if (nl && weakSpots().length) steps.push(done => runQuiz(mixedDrill(5, true), {title:'Schwächen: your weak spots', onDone: done}));
  let i = 0;
  const next = () => { if (i < steps.length) steps[i++](next); else sessionDone(); };
  next();
}
function sessionDone(){
  activity = true; nav();

// ---- quiz runner ----
function runQuiz(questions, {title, onDone}){
  activity = true; nav(); setHead(title, 'Üben / ' + questions.length + ' questions');
  const total = questions.length, queue = questions.map(q => ({q, tries:0}));
  let cleared = 0, firstTry = 0, earned = 0;
  function show(){
    if (!queue.length) return finish();
    const item = queue[0], q = item.q;
    let answered = false;
    $main.innerHTML = `
    <div class="qtop"><button class="linkbtn" id="quit" aria-label="Quit">${icon('x')}</button><div class="bar"><i style="width:${cleared/total*100}%"></i></div><span class="tag">${cleared}/${total}</span></div>
    <section class="qcard">
      <div class="qtext" id="qt">${q.html.replace('___','<span class="blank" id="blank">?</span>')}</div>
      ${q.sub ? `<div class="qsub">${q.sub}</div>` : ''}
      <p class="qlead">${icon('list')}${q.lead}${item.tries ? ' · second try' : ''}</p>
      <div class="opts ${q.gopts ? 'gopts' : ''} ${q.options.some(o => o.length > 20) ? 'long' : ''}">${q.options.map((o,i) => `<button class="opt" data-i="${i}" ${q.gopts ? `data-g="${['m','f','n'][i]}"` : ''} title="Key ${i+1}"><kbd>${'abcd'[i]}</kbd><span>${o}</span></button>`).join('')}</div>
      <div id="fb"></div>
    </section>`;
    document.getElementById('quit').onclick = () => { stopActivity(); render(); };
    const btns = [...$main.querySelectorAll('.opt')];
    const choose = (i) => {
      if (answered) return; answered = true;
      const ok = i === q.answer;
      btns.forEach((b,j) => { b.disabled = true; if (j === q.answer) b.classList.add('right'); else if (j === i) b.classList.add('wrong'); });
      const bl = document.getElementById('blank'); if (bl && q.fill){ bl.textContent = q.fill; bl.classList.add('filled'); }
      queue.shift();
      if (!item.tries && q.kind){ const st = state.stats[q.kind] || (state.stats[q.kind] = {n:0, c:0}); st.n++; if (ok) st.c++; }
      const x = ok ? (item.tries ? 5 : 10) : 0;
      if (ok){ cleared++; if (!item.tries) firstTry++; earned += x; addXP(x); }
      else if (item.tries < 1) queue.push({q, tries:1});
      else cleared++;
      document.getElementById('fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}" role="status">
        <div class="fbhead"><span class="fbi">${icon(ok ? 'check' : 'x')}</span><h3>${ok ? rnd(['Richtig!','Super!','Genau!','Sehr gut!']) : 'Nicht ganz.'}</h3>${ok ? `<span class="fbxp">${icon('sparkles')}+${x} XP</span>` : ''}</div>
        ${ok ? '' : `<p class="fbans">The answer is <b>${q.options[q.answer]}</b>.</p>`}
        <div class="fbwhy" id="why-txt" ${ok ? 'hidden' : ''}>${q.explain}${q.en ? `<div class="en">${q.en}</div>` : ''}</div>
        <div class="fbrow">${ok ? '<button class="btn ghost" id="why">Why?</button>' : ''}${q.say ? sayBtn(q.say) : ''}<button class="btn ${ok ? 'go' : ''}" id="next">Weiter${icon('next')}</button></div></div>`;
      const wb = document.getElementById('why'); if (wb) wb.onclick = () => { document.getElementById('why-txt').hidden = false; wb.remove(); };
      document.getElementById('next').onclick = show;
      document.getElementById('next').focus({preventScroll:true});
      if (state.sound && q.say) say(q.say);
    };
    btns.forEach(b => b.onclick = () => choose(+b.dataset.i));
    keyHandler = e => {
      if (!answered && /^[1-4]$/.test(e.key) && +e.key <= btns.length){ e.preventDefault(); choose(+e.key - 1); }
      else if (answered && e.key === 'Enter' && e.target.id !== 'next'){ e.preventDefault(); show(); }
    };
  }
  function finish(){
    keyHandler = null;
    const pct = Math.round(firstTry/total*100);
    $main.innerHTML = `<section class="celebrate">
      <div class="burst" aria-hidden="true"><div class="cbadge">${icon(pct >= 70 ? 'trophy' : 'check')}</div>${[1,2,3,4].map(n => `<i class="spark s${n}">${icon('sparkles')}</i>`).join('')}</div>
      <h2>${pct >= 90 ? 'Ausgezeichnet!' : pct >= 70 ? 'Gut gemacht!' : 'Geschafft!'}</h2>
      <div class="cstats"><div><small>XP earned</small><b>+${earned}</b></div><div><small>First try</small><b>${firstTry}/${total}</b></div></div>
      <p class="muted" style="margin:0;max-width:44ch">${pct < 70 ? 'Mistakes are how this works. Read the lesson again and repeat it tomorrow.' : 'Your answers are saved. The ones you missed come back later.'}</p>
      <button class="btn big" id="cont">Weiter${icon('next')}</button></section>`;
    document.getElementById('cont').onclick = () => { activity = false; onDone(firstTry, total); };
    document.getElementById('cont').focus({preventScroll:true});
  }
  show();
}

// ---- flashcards ----
function runCards(ids, {onDone, extra = false}){
  activity = true; nav(); setHead('Karten', extra ? 'Extra practice' : 'Spaced repetition');
  const queue = ids.map(id => ({id, again:false})), total = ids.length;
  let cleared = 0;
  function show(){
    if (!queue.length){ activity = false; return onDone(); }
    const it = queue[0], v = VBYID[it.id], card = state.cards[it.id] || {b:0};
    const de = (v.g ? gspan(v.g, G[v.g]) + ' ' : '') + v.de, sayTxt = (v.g ? G[v.g] + ' ' : '') + v.de;
    const reverse = card.b >= 2;
    const front = reverse ? `<div class="word" style="font-size:1.6rem">${v.en}</div><span class="tag">say it in German, then flip</span>` : `<div class="word">${de}</div>${sayBtn(sayTxt)}`;
    const back = reverse ? `<div class="word">${de}</div>${sayBtn(sayTxt)}` : `<div class="back">${v.en}</div>`;
    $main.innerHTML = `
    <div class="qtop"><button class="linkbtn" id="quit" aria-label="Quit">${icon('x')}</button><div class="bar"><i style="width:${cleared/total*100}%"></i></div><span class="tag">${cleared}/${total}</span></div>
    <section class="fc">${front}<div id="back" hidden><hr>${back}</div><span class="tag">${THEMES[v.th]}</span></section>
    <div class="row" id="flip"><button class="btn big" id="show">Show answer</button></div>
    <div class="row" id="rate" hidden style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button class="btn ghost big" id="no">Nochmal · again</button><button class="btn big" id="yes">Gewusst · knew it</button></div>`;
    if (!reverse && state.sound) say(sayTxt);
    let flipped = false;
    const flip = () => { flipped = true; document.getElementById('back').hidden = false; document.getElementById('flip').hidden = true; document.getElementById('rate').hidden = false; if (reverse && state.sound) say(sayTxt); };
    const rate = ok => {
      queue.shift();
      if (ok || it.again){ cleared++; }
      if (!extra) state.cards[it.id] = review(card, ok, today());
      if (!ok && !it.again) queue.push({id:it.id, again:true});
      addXP(ok ? 5 : 2);
      show();
    };
    document.getElementById('quit').onclick = () => { stopActivity(); render(); };
    document.getElementById('show').onclick = flip;
    document.getElementById('no').onclick = () => rate(false);
    document.getElementById('yes').onclick = () => rate(true);
    keyHandler = e => {
      if (!flipped && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); flip(); }
      else if (flipped && (e.key === '1' || e.key === 'ArrowLeft')) rate(false);
      else if (flipped && (e.key === '2' || e.key === 'ArrowRight' || e.key === ' ')){ e.preventDefault(); rate(true); }
    };
  }
  show();
}

let blitzTimer;
function runBlitz(onDone){
  activity = true; nav(); keyHandler = null; setHead('der-die-das Blitz', 'Üben / Spiele');
  $main.innerHTML = `<section class="card blitz stack" style="align-items:center">
    <h2>60 seconds. Pick the article.</h2>
    <p class="muted">Right answers in a row build a combo. Every mistake shows you the right article, so you learn while you play.</p>
    <p class="gtrio" style="justify-content:center"><span class="m">1 · der</span><span class="f">2 · die</span><span class="n">3 · das</span></p>
    <button class="btn big" id="start">Los geht’s!</button><button class="linkbtn" id="back">Back</button></section>`;
  document.getElementById('back').onclick = () => { stopActivity(); onDone(); };
  document.getElementById('start').onclick = play;
  function play(){
    const pool = shuffle(VOCAB.filter(v => ['m','f','n'].includes(v.g)));
    let i = 0, score = 0, combo = 0, bestCombo = 0, end = Date.now() + 60000;
    const misses = [];
    $main.innerHTML = `<section class="card blitz" id="bz">
      <div class="row" style="justify-content:space-between"><span class="timer" id="tm">60</span><span class="combo" id="cb"></span><span class="timer" id="sc">0</span></div>
      <div class="word" id="w"></div><div class="muted" id="en"></div>
      <div class="opts gopts">${['der','die','das'].map((a,j) => `<button class="opt" data-g="${'mfn'[j]}"><kbd>${j+1}</kbd>${a}</button>`).join('')}</div>
      <p class="muted" id="last" style="min-height:1.6em;margin-top:12px"></p></section>`;
    const bz = document.getElementById('bz');
    const showWord = () => { const v = pool[i % pool.length]; document.getElementById('w').textContent = v.de; document.getElementById('en').textContent = v.en; };
    const pick = g => {
      const v = pool[i % pool.length], ok = v.g === g;
      if (ok){ combo++; bestCombo = Math.max(bestCombo, combo); score += combo >= 5 ? 2 : 1; }
      else { combo = 0; if (!misses.includes(v)) misses.push(v); }
      document.getElementById('sc').textContent = score;
      document.getElementById('cb').textContent = combo >= 5 ? `combo ×2 (${combo})` : combo >= 2 ? `combo ${combo}` : '';
      document.getElementById('last').innerHTML = ok ? '' : `${gspan(v.g, G[v.g])} ${v.de}`;
      bz.classList.remove('flash-ok','flash-no'); void bz.offsetWidth; bz.classList.add(ok ? 'flash-ok' : 'flash-no');
      i++; showWord();
    };
    bz.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(b.dataset.g));
    keyHandler = e => { const k = {'1':'m','2':'f','3':'n',ArrowLeft:'m',ArrowDown:'f',ArrowRight:'n'}[e.key]; if (k){ e.preventDefault(); pick(k); } };
    showWord();
    clearInterval(blitzTimer);
    blitzTimer = setInterval(() => {
      const left = Math.max(0, Math.ceil((end - Date.now())/1000));
      const tm = document.getElementById('tm'); if (tm) tm.textContent = left;
      if (left <= 0) finish();
    }, 200);
    function finish(){
      clearInterval(blitzTimer); keyHandler = null;
      const record = score > (state.best.blitz || 0);
      if (record) state.best.blitz = score;
      const xp = Math.min(40, score * 2);
      if (xp) addXP(xp); else save();
      $main.innerHTML = `<section class="card stack" style="text-align:center;align-items:center">
        <h2>${record ? '<span class="hl">Neuer Rekord!</span>' : '<span class="hl">Zeit!</span>'}</h2>
        <div class="streak-num">${score}</div><div class="tag">points · best combo ${bestCombo}</div><p>+${xp} XP</p>
        ${misses.length ? `<div style="text-align:left;width:100%"><h4>Learn these ${misses.length}</h4><div class="words">${misses.map(v => `<span>${gspan(v.g, G[v.g])} ${v.de}</span>`).join('')}</div></div>` : '<p>No mistakes!</p>'}
        <div class="row" style="justify-content:center"><button class="btn" id="again">Again</button><button class="btn ghost" id="done">Done</button></div></section>`;
      document.getElementById('again').onclick = play;
      document.getElementById('done').onclick = () => { stopActivity(); onDone(); };
    }
  }
}

let clockTimer;
function startClock(deadline){
  clearInterval(clockTimer);
  const tick = () => {
    const el = document.getElementById('clock'); if (!el) return clearInterval(clockTimer);
    const left = Math.round((deadline - Date.now())/1000), a = Math.abs(left);
    el.textContent = `${left < 0 ? '+' : ''}${Math.floor(a/60)}:${String(a%60).padStart(2,'0')} ${left < 0 ? 'over time' : 'left'}`;
    el.classList.toggle('over', left < 0);
  };
  tick(); clockTimer = setInterval(tick, 1000);
}

// ---- listening: read a script aloud, one voice (or pitch) per speaker ----
function speakLines(lines){
  if (!('speechSynthesis' in window)) return false;
  try {
    speechSynthesis.cancel();
    const voices = speechSynthesis.getVoices().filter(v => /^de/i.test(v.lang)), who = [...new Set(lines.map(l => l[0]))];
    for (const [w, text] of lines) for (const t of text.split(/(?<=[.!?])\s+/).filter(x => x.trim())){
      const i = who.indexOf(w), u = new SpeechSynthesisUtterance(t);
      u.lang = 'de-DE'; u.rate = .95; u.pitch = [1, .8, 1.2][i % 3];
      if (voices.length) u.voice = voices[i % voices.length];
      speechSynthesis.speak(u);
    }
    return true;
  } catch(e) { return false; }
}

// ---- one reading or listening task: answer everything, then check ----
function runTask(task, {eyebrow = '', title = '', deadline = null, passLine = false, onScored, onDone}){
  activity = true; nav(); toTop(); setHead(title || task.title, eyebrow);
  const audio = task.audio && task.audio.length > 0, blocks = audio ? task.audio : task.texts;
  const ads = !audio && blocks.length >= 8;
  const sel = {}, plays = blocks.map(b => b.plays || 1);
  let checked = false;
  const order = [];
  if (!ads) blocks.forEach((b, i) => task.items.forEach((it, j) => { if (it.ref === i) order.push(j); }));
  task.items.forEach((it, j) => { if (!order.includes(j)) order.push(j); });
  const num = {}; order.forEach((j, n) => num[j] = n + 1);
  const itemHtml = j => { const it = task.items[j];
    return `<div class="item" data-item="${j}"><div class="iq"><b>${num[j]}</b><span>${esc(it.q)}</span></div>
      <div class="iopts">${it.o.map((o, k) => `<button class="io" data-j="${j}" data-k="${k}">${esc(o)}</button>`).join('')}</div><div class="ix" hidden></div></div>`; };
  const itemsFor = i => ads ? '' : order.filter(j => task.items[j].ref === i).map(itemHtml).join('');
  const rest = order.filter(j => ads || !(task.items[j].ref >= 0 && task.items[j].ref < blocks.length));
  const paras = s => esc(s).split('\n').filter(x => x.trim()).map(x => `<p>${x}</p>`).join('');
  const blockHtml = (b, i) => audio
    ? `<section class="card stack"><div class="audio"><button class="btn" data-play="${i}">${icon('play')}<span>${esc(b.label || 'Audio')}</span></button>
        <span class="tag" id="plays${i}">plays ${plays[i]}×</span><button class="linkbtn" data-stop>Stop</button></div>
        ${itemsFor(i)}<div class="transcript" id="tr${i}" hidden>${b.lines.map(([w, t]) => `<p><b>${esc(w)}:</b> ${esc(t)}</p>`).join('')}</div></section>`
    : `<section class="card textcard">${b.h ? `<h3>${esc(b.h)}</h3>` : ''}${paras(b.body)}${b.body.length > 300 ? `<div class="row" style="gap:8px;margin-top:6px"><button class="btn ghost" data-read="${i}">${icon('say')}<span>Vorlesen · listen</span></button><button class="linkbtn" data-stop>Stop</button></div>` : ''}</section>${itemsFor(i) ? `<div class="stack">${itemsFor(i)}</div>` : ''}`;
  $main.innerHTML = `
  <div class="row"><button class="linkbtn" id="tquit">${icon('back')}Back</button>${deadline ? '<span class="clock" id="clock"></span>' : ''}</div>
  <section class="card"><h2>${esc(title || task.title)}</h2>
    ${task.instr ? `<p class="instr">${esc(task.instr)}</p>` : ''}
    ${audio ? '<p class="muted" style="font-size:.88rem;margin-bottom:0">Read the questions first, then press play. Your device’s German voice reads the text. The transcript appears after you check.</p>' : ''}</section>
  ${ads ? `<div class="ads">${blocks.map(b => `<div class="card"><b>${esc(b.h)}</b>${esc(b.body)}</div>`).join('')}</div>` : blocks.map(blockHtml).join('')}
  ${rest.length ? `<div class="stack">${rest.map(itemHtml).join('')}</div>` : ''}
  ${task.glossary && task.glossary.length ? `<section class="card"><details><summary>Wörter · glossary (${task.glossary.length})</summary><div class="gloss" style="margin-top:8px">${task.glossary.map(([d, e]) => `<span><b>${esc(d)}</b> · ${esc(e)}</span>`).join('')}</div></details></section>` : ''}
  <div id="tres"></div>
  <button class="btn big" id="tcheck">Auswerten · check answers</button>`;
  if (deadline) startClock(deadline);
  $main.querySelectorAll('.io').forEach(b => b.onclick = () => {
    if (checked) return;
    sel[+b.dataset.j] = +b.dataset.k;
    b.parentElement.querySelectorAll('.io').forEach(x => x.classList.toggle('sel', x === b));
  });
  $main.querySelectorAll('[data-play]').forEach(b => b.onclick = () => {
    const i = +b.dataset.play;
    if (!checked){
      if (plays[i] <= 0) return;
      plays[i]--;
      document.getElementById('plays' + i).textContent = plays[i] ? `${plays[i]}× left` : 'last play';
      if (!plays[i]) b.disabled = true;
    }
    if (!speakLines(blocks[i].lines)) toast('This browser can’t read text aloud. Check your answers to see the transcript.');
  });
  $main.querySelectorAll('[data-stop]').forEach(b => b.onclick = () => { try { speechSynthesis.cancel(); } catch(e) {} });
  $main.querySelectorAll('[data-read]').forEach(b => b.onclick = () => { if (!speakLines([['', blocks[+b.dataset.read].body]])) toast('This browser can’t read text aloud.'); });
  document.getElementById('tquit').onclick = () => { stopActivity(); render(); };
  document.getElementById('tcheck').onclick = () => {
    if (checked){ try { speechSynthesis.cancel(); } catch(e) {} activity = false; return onDone(); }
    checked = true;
    let c = 0;
    task.items.forEach((it, j) => {
      const box = $main.querySelector(`[data-item="${j}"]`), ok = sel[j] === it.a;
      if (ok) c++;
      box.querySelectorAll('.io').forEach((b, k) => { b.disabled = true; if (k === it.a) b.classList.add('right'); else if (k === sel[j]) b.classList.add('wrong'); });
      const ix = box.querySelector('.ix'); ix.hidden = false; ix.className = 'ix ' + (ok ? 'ok' : 'no');
      ix.innerHTML = `${ok ? '✓ Richtig.' : `${sel[j] === undefined ? 'No answer.' : '✗'} Correct: <b>${esc(it.o[it.a])}</b>.`} ${esc(it.x)}`;
    });
    blocks.forEach((b, i) => { const tr = document.getElementById('tr' + i); if (tr) tr.hidden = false; const pl = document.getElementById('plays' + i); if (pl) pl.textContent = 'replay any time'; });
    $main.querySelectorAll('[data-play]').forEach(b => b.disabled = false);
    clearInterval(clockTimer);
    const total = task.items.length, pct = Math.round(c / total * 100);
    document.getElementById('tres').innerHTML = `<section class="card row" style="justify-content:space-between">
      <div><div class="score">${c}/${total}</div><span class="tag">${pct}%${passLine ? ` · ${pct >= 60 ? '<span class="pass">above the 60% pass line</span>' : '<span class="fail">below the 60% pass line</span>'}` : ''}</span></div>
      <p class="muted" style="max-width:42ch;margin:0">Each question now shows why its answer is right.${audio ? ' The transcripts are open: play the audio again while you read along.' : ''}</p></section>`;
    document.getElementById('tcheck').textContent = 'Weiter →';
    if (onScored) onScored(c, total);
    document.getElementById('tres').scrollIntoView({block:'center'});
  };
}

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
function vTelefon(){

  $main.innerHTML = `${backTo('Üben','ueben')}

    return `<button class="lesson ${best >= 80 ? 'done' : ''}" data-call="${i}"><span class="num">${icon(c.face ? 'dialog' : 'phone')}</span>
      <span style="min-width:0"><b>${esc(c.title)}</b><span>${esc(c.who)} · ${esc(c.where)} · ${c.steps.length} turns${l ? ` · words: ${esc(l.title)}` : ''}</span></span>

  $main.querySelectorAll('[data-call]').forEach(b => b.onclick = () => runCall(CALLS[+b.dataset.call], () => { view = 'telefon'; render(); toTop(); }));
}
function runCall(sc, onDone){
  activity = true; nav(); toTop(); keyHandler = null; setHead(sc.title, 'Üben / Telefon-Training');
  const n = sc.steps.length, scores = [], thread = [];
  let i = 0, best = 0, rec = null, showText = state.callText !== false;
  const bub = (who, text, en) => `<div class="bub ${who}"><p>${esc(text)}</p>${en ? `<small>${esc(en)}</small>` : ''}</div>`;
  function step(){
    const s = sc.steps[i]; best = 0;
    $main.innerHTML = `<section class="card call stack">
      <div class="callbar"><span class="cav">${icon(sc.face ? 'dialog' : 'phone')}</span><div><b>${esc(sc.who)}</b><small>${esc(sc.where)}</small></div>
        <span class="tag">${i + 1} / ${n}</span><button class="linkbtn" id="hang">${icon('x')}${sc.face ? 'End' : 'Auflegen'}</button></div>
      <div class="thread">${thread.join('')}${s.c ? `<div class="bub them ${showText ? '' : 'hide'}" id="cur"><p>${esc(s.c)}</p>${showText && s.en ? `<small>${esc(s.en)}</small>` : ''}</div>` : `<div class="ring">${icon('phone')}${sc.out ? `Sie rufen ${esc(sc.who)} an …` : 'Das Telefon klingelt …'}</div>`}</div>
      ${s.c ? `<div class="row"><button class="linkbtn" id="again">${icon('say')}Hear it again</button><button class="linkbtn" id="tt">${icon(showText ? 'eyeoff' : 'eye')}${showText ? 'Hide the text (listening practice)' : 'Show the text'}</button></div>` : ''}
      <p class="tip" style="margin:0"><b>Your turn:</b> ${esc(s.task)}</p>
      <div class="row" id="act">${SpeechRec ? `<button class="btn go big" id="mic">${icon('mic')}Answer out loud</button>` : ''}<button class="btn ${SpeechRec ? 'ghost' : 'go big'}" id="show">Show a good answer</button></div>
      <div id="res" class="stack" aria-live="polite"></div></section>`;
    const spoken = s.c.replace(/\(.*?\)\s*/g, '');
    if (spoken) say(spoken);
    if (i) (document.getElementById('cur') || $main.querySelector('.ring')).scrollIntoView({block:'start'});
    document.getElementById('hang').onclick = () => { stopActivity(); onDone(); };
    const ag = document.getElementById('again'); if (ag) ag.onclick = () => say(spoken);
    const tt = document.getElementById('tt'); if (tt) tt.onclick = () => { showText = !showText; state.callText = showText; save(); step(); };
    const mic = document.getElementById('mic'); if (mic) mic.onclick = () => listen(s, mic);
    document.getElementById('show').onclick = () => reveal(s, null);
  }
  function listen(s, btn){
    if (rec){ rec.stop(); return; }
    try { speechSynthesis.cancel(); } catch(e) {}
    const res = document.getElementById('res');
    let text = '', failed = '';
    rec = new SpeechRec(); rec.lang = 'de-DE'; rec.interimResults = true; rec.maxAlternatives = 1; ctls.add(rec);
    rec.onresult = e => { text = Array.from(e.results, r => r[0].transcript).join(' '); res.innerHTML = `<div class="bub me live"><p>${esc(text)}</p></div>`; };
    rec.onerror = e => { failed = e.error; };
    rec.onend = () => {
      ctls.delete(rec); rec = null; btn.classList.remove('rec'); btn.innerHTML = icon('mic') + 'Answer out loud';
      if (text.trim()) return reveal(s, text);
      res.innerHTML = `<p class="muted" style="margin:0">${failed === 'not-allowed' || failed === 'service-not-allowed' ? 'The app may not use the microphone. Allow it in your browser’s site settings, or say your answer out loud and tap “Show a good answer”.'
        : failed === 'network' ? 'Speech recognition needs internet. Say your answer out loud and tap “Show a good answer”.'
        : 'I didn’t hear anything. Tap the microphone and speak, or tap “Show a good answer”.'}</p>`;
    };
    try { rec.start(); btn.classList.add('rec'); btn.innerHTML = icon('mic') + 'Listening … tap to stop'; res.innerHTML = ''; }
    catch(e){ ctls.delete(rec); rec = null; }
  }
  function reveal(s, said){
    const res = document.getElementById('res');
    if (said != null){
      const r = phoneCheck(said, s.keys); best = Math.max(best, r.score);
      res.innerHTML = `${bub('me', said)}
        <div class="kcheck">${s.keys.map(k => `<span class="${r.hit.includes(k) ? 'ok' : 'no'}">${icon(r.hit.includes(k) ? 'check' : 'x')}${esc(k.split('/')[0])}</span>`).join('')}</div>
        <p class="muted" style="margin:0">${r.score === 1 ? 'You said everything that matters.' : r.score >= .5 ? 'Good. Compare with the answer below and try once more for the missing words.' : 'Listen to a good answer, then try again.'}</p>`;
    } else res.innerHTML = '';
    res.insertAdjacentHTML('beforeend', `<div class="model"><div><small>A good answer</small><p>${esc(s.model)}</p></div>${sayBtn(s.model)}</div>
      ${said == null ? `<p class="muted" style="margin:0">Did you say something like this?</p><div class="row" id="self"><button class="btn ghost" data-sc="1">Yes</button><button class="btn ghost" data-sc=".5">Almost</button><button class="btn ghost" data-sc="0">Not yet</button></div>`
        : `<div class="row">${SpeechRec ? `<button class="btn ghost" id="retry">${icon('mic')}Try again</button>` : ''}<button class="btn go" id="next">Weiter${icon('next')}</button></div>`}`);
    if (said == null){ say(s.model); res.querySelectorAll('[data-sc]').forEach(b => b.onclick = () => { best = Math.max(best, +b.dataset.sc); next(s, null); }); }
    else {
      document.getElementById('next').onclick = () => next(s, said);
      const rt = document.getElementById('retry'); if (rt) rt.onclick = () => listen(s, rt);
    }
    document.getElementById('act').hidden = true;
    res.scrollIntoView({block:'nearest'});
  }
  function next(s, said){
    scores.push(best);
    if (s.c) thread.push(bub('them', s.c));
    thread.push(bub('me', said || s.model));
    if (++i < n) return step();
    finish();
  }
  function finish(){
    const pct = Math.round(scores.reduce((a, b) => a + b, 0) / n * 100), xp = 5 + Math.round(pct / 10);
    state.calls = state.calls || {}; state.calls[sc.id] = Math.max(state.calls[sc.id] || 0, pct); addXP(xp);
    $main.innerHTML = `<section class="celebrate">
      <div class="burst" aria-hidden="true"><div class="cbadge">${icon(sc.face ? 'dialog' : 'phone')}</div>${[1,2,3,4].map(k => `<i class="spark s${k}">${icon('sparkles')}</i>`).join('')}</div>
      <h2>${pct >= 80 ? 'Super Gespräch!' : pct >= 50 ? 'Gut gemacht!' : 'Geschafft!'}</h2>
      <div class="cstats"><div><small>Key words</small><b>${pct}%</b></div><div><small>XP earned</small><b>+${xp}</b></div></div>
      <p class="muted" style="margin:0;max-width:44ch">${pct >= 80 ? 'Try it again with the text hidden: then it is real listening, like on the phone.' : 'Do the call again tomorrow. Each time the sentences come faster.'}</p>
      <button class="btn big" id="redo">${icon('repeat')}Do this call again</button><button class="btn ghost big" id="back">Back to the calls</button></section>`;
    document.getElementById('redo').onclick = () => runCall(sc, onDone);
    document.getElementById('back').onclick = () => { stopActivity(); onDone(); };
  }
  step();
}

  const ta = document.getElementById('ta-' + w.id), wc = document.getElementById('wc-' + w.id), key = 'wzb1:draft:' + w.id;
  try { ta.value = localStorage.getItem(key) || ''; } catch(e) {}
  let t;
  const upd = () => { wc.textContent = `${wordCount(ta.value)} / about ${w.words} words`; clearTimeout(t); t = setTimeout(() => { try { localStorage.setItem(key, ta.value); } catch(e) {} }, 400); };
  ta.addEventListener('input', upd); upd();
  document.querySelector(`.umlauts[data-for="${w.id}"]`).querySelectorAll('[data-ch]').forEach(b => {
    b.onmousedown = e => e.preventDefault();
    b.onclick = () => { ta.setRangeText(b.dataset.ch, ta.selectionStart, ta.selectionEnd, 'end'); ta.focus(); upd(); };
  });
  return ta;
}
function correctionHtml(w, r){
  const crit = r.criteria ? Object.entries(r.criteria).slice(0, 4).map(([k, v]) => `<div><span class="tag">${esc(k)}</span><b>${esc(v)} / 5</b></div>`).join('') : '';
  return `<div class="stack" style="margin-top:6px;border-top:1px dashed var(--line);padding-top:12px">
    <div><div class="score">${r.score}%</div><span class="tag">${w.exam ? `about ${Math.round(r.score * EXAM_POINTS[w.exam] / 100)} of ${EXAM_POINTS[w.exam]} points · ` : ''}${r.score >= 60 ? '<span class="pass">on track</span>' : '<span class="fail">keep practising</span>'}</span></div>
    ${r.points.length ? `<ul class="points" style="list-style:none;padding:0;margin:0">${w.points.map((p, i) => `<li>${r.points[i] ? '<span class="pass">✓</span>' : '<span class="fail">✗</span>'} ${esc(p)}</li>`).join('')}</ul>` : ''}
    ${crit ? `<div class="crit">${crit}</div>` : ''}
    ${r.good ? `<p style="margin:0"><b>Gut:</b> ${esc(r.good)}</p>` : ''}
    ${r.mistakes.length ? `<h4 style="margin:0">Mistakes (${r.mistakes.length})</h4><ul class="mist">${r.mistakes.map(m => `<li><s>${esc(m.wrong)}</s> → <ins>${esc(m.right)}</ins><br><span class="muted">${esc(m.why)}</span></li>`).join('')}</ul>` : '<p class="pass" style="margin:0">No mistakes found.</p>'}
    ${r.tip ? `<p class="tip" style="margin:0"><b>Next:</b> ${esc(r.tip)}</p>` : ''}
    ${r.corrected ? `<details open><summary>Corrected text</summary><div class="prose" style="margin-top:8px">${esc(r.corrected)}</div></details>` : ''}
    ${r.model ? `<details><summary>Model answer</summary><div class="row" style="margin-top:8px;align-items:flex-start">${sayBtn(r.model)}<div class="prose" style="flex:1;min-width:0">${esc(r.model)}</div></div></details>` : ''}
  </div>`;
}
function checkHtml(w, text){
  const auto = writingChecks(w, text), ok = auto.filter(c => c.ok).length;
  return `<div class="stack wcheck" data-ok="${ok}" data-n="${auto.length}" style="margin-top:6px;border-top:1px dashed var(--line);padding-top:12px">
    <div><div class="score" data-est>–</div><span class="tag">${w.exam ? `about <b data-pts>0</b> of ${EXAM_POINTS[w.exam]} points · ` : ''}your estimate: half the checks, half the points you tick</span></div>
    <h4 style="margin:0">Automatic checks</h4>
    <ul class="checks">${auto.map(c => `<li><span class="${c.ok ? 'pass' : 'fail'}">${c.ok ? '✓' : '✗'}</span><span><b>${esc(c.label)}</b>${c.note ? `<br><span class="muted">${esc(c.note)}</span>` : ''}</span></li>`).join('')}</ul>
    <h4 style="margin:0">Did you write about every point? Tick the ones you covered.</h4>
    <div class="ticks">${w.points.map((p, i) => `<label><input type="checkbox" data-pt="${i}"><span>${esc(p)}</span></label>`).join('')}</div>
    <h4 style="margin:0">Read your text once more and check</h4>
    <ul class="points">${PROOF[w.level].map(x => `<li>${x}</li>`).join('')}</ul>
    <details><summary>Model answer</summary><div class="row" style="margin-top:8px;align-items:flex-start">${sayBtn(w.model)}<div class="prose" style="flex:1;min-width:0">${esc(w.model)}</div></div></details>
  </div>`;
}
// Wires the tick boxes; calls onEst(percent) now and after every tick.
function bindCheck(box, w, onEst){
  const ok = +box.dataset.ok, n = +box.dataset.n, pts = [...box.querySelectorAll('[data-pt]')];
  const upd = () => {
    const e = writingEstimate(ok, n, pts.filter(p => p.checked).length, pts.length);
    box.querySelector('[data-est]').textContent = e + '%';
    const b = box.querySelector('[data-pts]'); if (b) b.textContent = Math.round(e * EXAM_POINTS[w.exam] / 100);
    onEst(e);
  };
  pts.forEach(p => p.onchange = upd); upd();
}
function openWriting(w, back, onChecked){
  activity = true; nav(); toTop(); setHead(w.title, `Schreiben / ${w.level}`);
  $main.innerHTML = `<div class="row"><button class="linkbtn" id="wback">${icon('back')}Back</button></div>${editorHtml(w)}
    <button class="btn big" id="wcheck">Prüfen · check my text</button>
    ${getKey() ? '<button class="btn ghost big" id="wai">Explain my mistakes with Gemini</button>' : '<p class="muted" style="font-size:.85rem;margin:0">Want every mistake explained and a corrected text? Add a free Gemini key in <button class="linkbtn" data-goto="daten" style="display:inline;padding:0">Settings</button>.</p>'}
    <p class="muted" style="font-size:.85rem;margin:0">Your draft is saved on this device while you type.</p>`;
  const ta = bindEditor(w), btn = document.getElementById('wcheck'), res = document.getElementById('res-' + w.id), aib = document.getElementById('wai'), aires = document.getElementById('ai-' + w.id);
  let rewarded = false;
  document.getElementById('wback').onclick = () => { stopActivity(); view = back; render(); toTop(); };
  btn.onclick = () => {
    if (wordCount(ta.value) < 3){ toast('Write a few sentences first.'); ta.focus(); return; }
    res.innerHTML = checkHtml(w, ta.value);
    bindCheck(res.firstElementChild, w, e => { state.writing[w.id] = {s:e, d:today()}; save(); });
    if (!rewarded){ rewarded = true; addXP(25); if (onChecked) onChecked(); }
    btn.textContent = 'Prüfen · check again';
    res.scrollIntoView({block:'start'});
  };
  if (aib) aib.onclick = async () => {
    if (wordCount(ta.value) < 3){ toast('Write a few sentences first.'); ta.focus(); return; }
    aib.disabled = true; aib.textContent = 'Gemini is reading your text …';
    aires.innerHTML = '<div class="row" style="margin-top:8px"><div class="spinner" aria-hidden="true"></div><span class="muted">Checking grammar, content and length. This takes 10 to 40 seconds.</span></div>';
    try {
      const r = normCorrection(await askJSON(correctionPrompt(w, ta.value)));
      aires.innerHTML = correctionHtml(w, r);
      state.writing[w.id] = {s:r.score, d:today()};
      if (!rewarded){ rewarded = true; addXP(25); } else save();
      aires.scrollIntoView({block:'start'});
    } catch(e){
      if (e && e.code === 'cancelled') return;
      aires.innerHTML = `<p class="fail" style="margin-top:8px">${esc(geminiMsg(e))}</p>`;
    } finally { aib.disabled = false; aib.textContent = 'Explain my mistakes with Gemini'; }
  };
}

// ---- Prüfung: Goethe B1 simulator ----

      <details><summary>Practise one Teil</summary><div class="stack" style="margin-top:10px">${m.teile.map((t, i) => `<div class="row" style="justify-content:space-between">

  <section class="card stack">

  </section>
  <section class="card stack">
    <div class="row" style="justify-content:space-between"><h3>Sprechen</h3><span class="tag">15 min · with a partner</span></div>
    <p style="margin:0">Teil 1: plan something together with your partner. Teil 2: present a topic on five slides (about 3 minutes). Teil 3: answer questions about your presentation and react to your partner’s. You get 15 minutes to prepare.</p>

    <div class="row">${WRITING.filter(w => w.speak).map(w => `<button class="btn ghost" data-sp="${w.id}">${esc(w.title.replace('Sprechen Teil 2: ', ''))}</button>`).join('')}</div>

  $main.querySelectorAll('[data-mod]').forEach(b => b.onclick = () => { const [k, si] = b.dataset.mod.split(':'); runModule(k, si === 'ai' ? 'ai' : +si); });
  $main.querySelectorAll('[data-teil]').forEach(b => b.onclick = () => { const [k, i, si] = b.dataset.teil.split(':'); practiceTeil(k, +i, si === 'ai' ? 'ai' : +si); });
  $main.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => openWriting(WRITING.find(w => w.id === b.dataset.sp), 'pruefung'));

const examSets = key => [EXAM[key].teile, EXAM[key].teile2].filter(Boolean);
const backToExam = () => { view = 'pruefung'; render(); toTop(); };
async function practiceTeil(key, i, si){
  const m = EXAM[key];
  activity = true; nav();
  let t;
  if (si === 'ai'){
    loadingView(`Gemini is writing ${m.name} ${m.teile[i].title.split(' · ')[0]} …`);
    try { t = validTask(await askJSON(examTeilPrompt(key, i, rnd(TOPICS)))); }
    catch(e){ if (!(e && e.code === 'cancelled')) errorView(geminiMsg(e), () => practiceTeil(key, i, si)); return; }
    if (!activity) return;
  } else t = examSets(key)[si][i];
  runTask(t, {eyebrow:`Goethe B1 · ${m.name} · ${si === 'ai' ? 'new from Gemini' : 'Set ' + (si + 1)}`, title:m.teile[i].title, passLine:true, onScored:c => addXP(3*c), onDone:backToExam});
}
function runModule(key, si){
  const ai = si === 'ai', m = EXAM[key], teile = ai ? m.teile : examSets(key)[si], n = teile.length, res = [], cache = {}, ready = {}, topic = rnd(TOPICS), started = Date.now();
  const deadline = started + m.min * 60000, label = ai ? 'new from Gemini' : 'Set ' + (si + 1);
  // a Gemini set is written one Teil at a time; the next one is requested while you work on the current one
  const get = i => cache[i] || (cache[i] = (ai ? askJSON(examTeilPrompt(key, i, topic)).then(validTask) : Promise.resolve(teile[i])).then(t => { ready[i] = true; return t; }));
  activity = true; nav();
  const step = async i => {
    if (i >= n) return finish();
    if (!ready[i] && ai) loadingView(`Gemini is writing ${m.name} Teil ${i+1} of ${n} …`, i ? 'Nearly there. The next part was being written while you worked.' : undefined);
    let t;
    try { t = await get(i); }
    catch(e){ delete cache[i]; if (!(e && e.code === 'cancelled')) errorView(geminiMsg(e), () => { activity = true; step(i); }); return; }
    if (!activity) return;
    if (ai && i + 1 < n) get(i + 1).catch(() => { delete cache[i + 1]; });
    runTask(t, {eyebrow:`Goethe B1 · ${m.name} · ${label} · Teil ${i+1} of ${n}`, title:teile[i].title, deadline, passLine:true,
      onScored:(c, tot) => { res[i] = {c, tot}; }, onDone:() => { activity = true; step(i + 1); }});
  };
  function finish(){
    activity = true; nav(); toTop();
    const c = res.reduce((a, r) => a + r.c, 0), tot = res.reduce((a, r) => a + r.tot, 0);
    const pts = Math.round(c / tot * 100), used = Math.round((Date.now() - started) / 60000);
    state.exams = (state.exams || []).concat({d:today(), m:`${m.name} · ${ai ? 'Gemini' : 'Set ' + (si + 1)}`, s:pts}).slice(-30);
    addXP(40);
    $main.innerHTML = `<section class="card stack" style="text-align:center;align-items:center">
      <h2><span class="hl">${pts >= 60 ? 'Bestanden!' : 'Noch nicht bestanden'}</span></h2>
      <div class="score">${pts}/100</div><div class="tag">${c} of ${tot} right · ${used} of ${m.min} minutes</div>
      <div class="hist" style="width:100%;text-align:left">${res.map((r, i) => `<div><span>${esc(teile[i].title)}</span><span>${r.c}/${r.tot}</span></div>`).join('')}</div>
      <p style="margin:0">${pts >= 60 ? 'That would pass. Aim for 70 or more, so a bad day in the real exam still passes.' : 'You need 60 points. Practise the parts with the lowest score one by one, then try the full module again.'}</p>
      <button class="btn" id="mdone">Back to Prüfung</button></section>`;
    document.getElementById('mdone').onclick = () => { stopActivity(); backToExam(); };
  }
  step(0);
}
function runWriteExam(){
  activity = true; nav(); toTop(); setHead('Schreiben · 60 Minuten', 'Prüfung / Goethe B1');
  const tasks = [1, 2, 3].map(n => rnd(WRITING.filter(w => w.exam === n)));
  $main.innerHTML = `<div class="row"><button class="linkbtn" id="xquit">${icon('back')}Back</button><span class="clock" id="clock"></span></div>
    <section class="card"><h2>Schreiben · 60 Minuten</h2>
      <p class="instr">Suggested times: Aufgabe 1 about 20 minutes, Aufgabe 2 about 25 minutes, Aufgabe 3 about 15 minutes. Hand in all three at the end.</p></section>
    ${tasks.map((w, i) => editorHtml(w, `Aufgabe ${i+1} · ${EXAM_POINTS[w.exam]} Punkte`)).join('')}
    <div id="xres"></div>
    <button class="btn big" id="xsubmit">Abgeben · hand in all three</button>`;
  const tas = tasks.map(bindEditor), btn = document.getElementById('xsubmit');
  startClock(Date.now() + 60 * 60000);
  document.getElementById('xquit').onclick = () => { stopActivity(); render(); };
  const est = [0, 0, 0], total = () => Math.round(tasks.reduce((a, w, i) => a + est[i] * EXAM_POINTS[w.exam] / 100, 0));
  btn.onclick = () => {
    if (btn.dataset.done){
      state.exams = (state.exams || []).concat({d:today(), m:'Schreiben', s:total()}).slice(-30); addXP(40);
      stopActivity(); return backToExam();
    }
    clearInterval(clockTimer);
    const xres = document.getElementById('xres');
    const show = () => {
      const p = total();
      xres.innerHTML = `<section class="card stack" style="text-align:center;align-items:center">
        <h2><span class="hl">${p >= 60 ? 'Wahrscheinlich bestanden' : 'Noch nicht bestanden'}</span></h2><div class="score">${p}/100</div>
        <p class="muted" style="margin:0">Your estimate. Tick the task points you covered under each text and compare with the model answers. Then press the button at the bottom to save the result.</p></section>`;
    };
    tasks.forEach((w, i) => {
      const box = document.getElementById('res-' + w.id);
      box.innerHTML = checkHtml(w, tas[i].value);
      bindCheck(box.firstElementChild, w, e => { est[i] = wordCount(tas[i].value) < 3 ? 0 : e; show(); });
    });
    btn.dataset.done = '1'; btn.textContent = 'Save result and go back';
    xres.scrollIntoView({block:'start'});
  };
}
